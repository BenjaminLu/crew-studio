id: designer
version: 1.0.0
title: { en: "Coffee designer — text and source review", zh-TW: "咖啡店設計審查：文字與原始碼" }
applies_to: [run]
kind: judged
blocking: true
needs: [artifact, coffee_review_snapshot]
judge:
