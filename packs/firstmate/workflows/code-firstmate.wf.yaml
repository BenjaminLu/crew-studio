# code-firstmate: firstmate's coding pipeline as a Studio v2 workflow on the check
# contract (docs/code-firstmate-pipeline.md). Checks sit on nodes (they run after
# the node produces) and on edges (they run before the edge is taken). The refine
# nodes (spec-fix, plan-fix, fix) compile briefs from the findings and stop on
# the same class twice, no progress, or the round cap. Humans: dispatch, the
# escalation cards and the merge card. The escalation cards (firstmate_first) go
# to Firstmate first: it decides within the spec or escalates with its diagnosis.
id: code-firstmate
name: code-firstmate
kind: code
version: 1
description: "firstmate's coding pipeline: spec (refined until its checks pass) → dispatch → door → plan (one-way) → build ⇄ fix → CI, fail-first → fresh reviewer → designer (UI changes: the before / after captures) → the six gates and the design gate on the edge into the merge card → local merge → after-merge hooks."
intent:
  keywords: [fix, bug, add, feature, refactor, code, function, test, tests, implement, change, migration, schema, endpoint, api, repo, repository, rename]
params:
  repo: { label: "Repository path (blank = the demo repo)", default: "" }
  project: { label: "Project id (optional)", default: "" }
  base: { label: "Base branch", default: "main" }
roles:
  - { id: coordinator, label: Coordinator (firstmate), seat: coordinator, skill: "pack:firstmate/skills/firstmate.md" }
  - { id: worker, label: Worker, seat: maker, skill: "pack:firstmate/skills/worker.md" }
  - { id: reviewer, label: Reviewer, seat: reviewer, skill: "pack:firstmate/skills/reviewer.md" }
  - { id: designer, label: Designer reviewer, seat: design-reviewer, skill: "pack:firstmate/skills/designer.md" }
nodes:
  - { id: intake, kind: hook, label: Capture intent, do: intent.capture, x: 170, y: 220 }
  - { id: prepare, kind: hook, label: Worktree, detail: "branch on base", do: repo.prepare, x: 340, y: 220 }
  - id: spec
    kind: agent
    label: Spec
    detail: "what · why · done · scope · door"
    role: coordinator
    mode: spec
    retries: 1
    timeout_s: 900
    # skills by duty, from the built-in library (packs/core/skills), pinned by version and hash: the coordinator writes specs and cards
    skills: [{ id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }, { id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }]
    checks:
      - { use: firstmate/spec-schema }
      - { use: firstmate/done-lines-provable }
      - { use: firstmate/caller-coverage }
      - { use: firstmate/overlap }
      - { use: core/ste-wording }
      # judged checks load their own duty skills after the role skill they judge as
      - { use: firstmate/no-impl-detail, skills: [{ id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }, { id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }] }
      - { use: firstmate/done-lines-observable, skills: [{ id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }, { id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }] }
      # the round contract's environment preflight: a gap goes to Firstmate (spec-fix), never to a HOLD inside the build round
      - { use: firstmate/env-preflight }
    x: 510
    y: 220
  - { id: spec-fix, kind: loop, label: Refine spec, detail: "brief from the findings", args: { producer: spec, coordinator: coordinator, route_classes: { door-change: door-change, env.permission: env-permission } }, x: 510, y: 40 }
  - id: dispatch
    kind: card
    label: Dispatch card
    args: { body_from: dispatch, card_kind: dispatch }
    x: 680
    y: 220
  - { id: door, kind: check, label: Door, detail: "scope ∩ sensitive paths", checks: [{ use: firstmate/door-classify }], args: { route_from: firstmate/door-classify, store: door }, x: 850, y: 220 }
  - id: door-pick
    kind: card
    label: Pick the door
    args: { body_from: door, card_kind: question }
    x: 850
    y: 40
  - id: plan
    kind: agent
    label: Plan round
    detail: "one-way: no file changes"
    role: worker
    mode: plan
    lane: one-way
    retries: 1
    timeout_s: 900
    # the worker's plan is a technical text the coordinator signs
    skills: [{ id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }, { id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }]
    checks:
      - { use: firstmate/plan-covers-done-lines }
      - { use: firstmate/questions-listed }
    x: 1020
    y: 400
  - { id: plan-fix, kind: loop, label: Refine plan, args: { producer: plan }, lane: one-way, x: 1020, y: 580 }
  - { id: plan-accept, kind: agent, label: Accept plan, detail: "signed: round + head", role: coordinator, mode: plan-accept, lane: one-way, retries: 1, timeout_s: 600, skills: [{ id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }, { id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }], x: 1190, y: 400 }
  - id: build
    kind: agent
    label: Build round
    detail: "brief bound to round + head"
    lifecycle: [after_round]
    role: worker
    mode: build
    retries: 1
    # the worker proves each change with a test that failed first, and writes its commits
    skills: [{ id: fail-first-testing, v: 1, sha256: "0b93df9b6342081edfee0d0618bf2e3b682a4e27584fb6bde2167d08bc19574b" }, { id: commit-and-pr-text, v: 1, sha256: "e92ab61a72b282dbc38f65065e699c303d1ad7727d26221ef8d5faba7c5dd0bd" }]
    checks:
      - { use: firstmate/scope }
      - { use: firstmate/lints }
      - { use: firstmate/file-size-cap }
      - { use: firstmate/covering-suites }
      - { use: firstmate/fixture-modules }
      - { use: firstmate/report-schema }
    x: 1360
    y: 220
  # the pull request text (a GitHub project with a template) is the coordinator's model turn on this hook: its own skills
  - { id: pr-open, kind: hook, do: pr.open, label: Review request, skills: [{ id: commit-and-pr-text, v: 1, sha256: "e92ab61a72b282dbc38f65065e699c303d1ad7727d26221ef8d5faba7c5dd0bd" }, { id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }], x: 1530, y: 220 }
  - id: ci
    kind: check
    label: CI
    detail: "sharded · fail-first · shard budget"
    checks:
      - { use: firstmate/ci }
      - { use: firstmate/fail-first }
      - { use: firstmate/shard-budget }
      - { use: firstmate/ui-captures }
    x: 1700
    y: 220
  - id: review
    kind: agent
    label: Fresh reviewer
    detail: "runs the tests, reads every changed file"
    role: reviewer
    mode: review
    retries: 1
    # the reviewer judges correctness and safety, checks the tests failed first, and writes findings people read
    skills: [{ id: code-review, v: 1, sha256: "fa2160d6efbe11758074c2c736414335970d087420509cf10eac72d9a08efd20" }, { id: security-review, v: 1, sha256: "fab0ac443e5c3fd66ed27ee8f933aea4b6ffcc86a3a3a14e9ffe798616b1f16d" }, { id: fail-first-testing, v: 1, sha256: "0b93df9b6342081edfee0d0618bf2e3b682a4e27584fb6bde2167d08bc19574b" }, { id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }]
    timeout_s: 900
    checks:
      - { use: firstmate/review-depth }
      - { use: firstmate/review-verdict, skills: [{ id: code-review, v: 1, sha256: "fa2160d6efbe11758074c2c736414335970d087420509cf10eac72d9a08efd20" }, { id: security-review, v: 1, sha256: "fab0ac443e5c3fd66ed27ee8f933aea4b6ffcc86a3a3a14e9ffe798616b1f16d" }] }
    x: 1870
    y: 220
  # a diff touching UI paths (policy ui_paths, plus the paths .crew/app.json declares) gets a fresh-context designer round on
  # the captures; any other diff skips it with the reason recorded in the ledger
  - { id: design-scope, kind: check, label: "UI change?", detail: "UI paths → designer; else not applicable", checks: [{ use: firstmate/design-scope }], args: { route_from: firstmate/design-scope, store: designScope }, x: 1870, y: 40 }
  - id: designer
    kind: agent
    label: Designer
    detail: "fresh context · before / after captures · APPROVE or REJECT"
    role: designer
    mode: design-review
    retries: 1
    timeout_s: 900
    skills: [{ id: visual-design-review, v: 1, sha256: "0243bc65903c94c57dd3edc2bf032414e3206eb54a5cc2a340932278c858a055" }, { id: accessible-ui, v: 1, sha256: "6e910784ba33844814cbd05e476cfc25a5c47321b2c796ecb6436ff10692ddb0" }, { id: web-interaction, v: 1, sha256: "ec37230c4d2d5731347228961767a6d327eb547d588fce69f9172a720354b3b1" }]
    checks:
      - { use: firstmate/design-verdict }
      - { use: firstmate/designer-compare, skills: [{ id: visual-design-review, v: 1, sha256: "0243bc65903c94c57dd3edc2bf032414e3206eb54a5cc2a340932278c858a055" }, { id: accessible-ui, v: 1, sha256: "6e910784ba33844814cbd05e476cfc25a5c47321b2c796ecb6436ff10692ddb0" }] }
    x: 2070
    y: 40
  # the app is declared but its captures are missing: a typed env gap, Firstmate first; only its escalation reaches the captain
  - { id: design-gap, kind: agent, label: Capture gap, detail: "Firstmate routes the env gap", role: coordinator, mode: design-gap, retries: 1, timeout_s: 600, skills: [{ id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }, { id: technical-writing, v: 1, sha256: "7bad12825f2a2a990841a4952f2d53861ceb6892838182179bb680d0ebd34fd4" }], x: 2240, y: 40 }
  - id: design-gap-card
    kind: card
    label: Capture gap card
    args: { body_from: design-gap, card_kind: question }
    x: 2410
    y: 40
  - { id: fix, kind: loop, label: Fix (refine loop), detail: "brief · step-back · budget", args: { producer: build, coordinator: coordinator, route_classes: { door-change: door-change, review-unverified: step-back, design-unverified: step-back }, answer_routes: { "step-back:other-model": pass }, report_checks: [firstmate/report-schema] }, x: 1700, y: 460 }
  - { id: remote-ready, kind: hook, do: remote.ready, label: Remote readiness, x: 1970, y: 220 }
  - id: merge-card
    kind: card
    label: Merge card
    detail: "ledger · one-way: door confirmation"
    args: { body_from: merge, card_kind: merge }
    card: { confirm_door: true, door_from: door }
    x: 2070
    y: 220
  - { id: merge, kind: hook, label: Merge, detail: "local fast-forward", do: git.merge, lifecycle: [after_merge], x: 2240, y: 220 }
  - id: after-merge
    kind: hook
    label: After merge
    detail: "self-update · main CI · follow-ups · retro"
    checks:
      - { use: firstmate/self-update }
      - { use: firstmate/main-ci }
      - { use: firstmate/follow-up-triage, skills: [{ id: code-review, v: 1, sha256: "fa2160d6efbe11758074c2c736414335970d087420509cf10eac72d9a08efd20" }, { id: plain-writing, v: 1, sha256: "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467" }] }
      - { use: firstmate/retro-trigger }
    x: 2410
    y: 220
  - { id: cleanup, kind: hook, label: Clean up, do: repo.cleanup, x: 2580, y: 220 }
  - { id: done, kind: hook, label: Merged, args: { summary: "merged {{ctx.merged.head}} into {{ctx.base}}" }, x: 2750, y: 220 }
  - id: step-back
    kind: card
    label: Step-back card
    detail: "same class twice · reviewer unverified"
    args: { body_from: step-back, card_kind: step-back, firstmate_first: true }
    x: 1870
    y: 640
  - id: stalled
    kind: card
    label: No-progress card
    args: { body_from: stalled, card_kind: step-back, firstmate_first: true }
    x: 1700
    y: 640
  - id: budget
    kind: card
    label: Round-budget card
    args: { body_from: budget, card_kind: round-budget, firstmate_first: true }
    card: { effects: { extend: { policy: round_cap, add: 2 } } }
    x: 1360
    y: 640
  - id: scope-card
    kind: card
    label: Scope card
    args: { body_from: scope, card_kind: scope, firstmate_first: true }
    x: 1190
    y: 40
  - { id: parked, kind: hook, label: Parked, args: { result: closed, summary: "parked by the captain" }, x: 2070, y: 640 }
  - { id: closed, kind: hook, label: Closed, args: { result: closed, summary: "closed without merging" }, x: 2240, y: 400 }
  - { id: dropped, kind: hook, label: Dropped, args: { result: closed, summary: "dropped at dispatch" }, x: 680, y: 400 }
edges:
  - [intake, prepare]
  - [prepare, spec]
  - [spec, dispatch, ok]
  - [spec, spec-fix, fail]
  - [spec, scope-card, blocked]
  - [spec-fix, spec, retry|report]
  - [spec-fix, dispatch, pass]
  - [spec-fix, scope-card, step-back|stalled|cap|door-change|env-permission]
  - [dispatch, door, dispatch]
  - [dispatch, spec, rescope]
  - [dispatch, dropped, drop]
  - [door, plan, one-way]
  - [door, build, two-way]
  - [door, door-pick, undecided]
  - [door-pick, door]
  - [plan, plan-accept, ok]
  - [plan, plan-fix, fail]
  - [plan, scope-card, blocked]
  - [plan-fix, plan, retry|report]
  - [plan-fix, plan-accept, pass]
  - [plan-fix, scope-card, step-back|stalled|cap|door-change]
  - [plan-accept, build, accept]
  - [plan-accept, plan, revise]
  - [plan-accept, scope-card, escalate|blocked]
  - [build, pr-open, ok]
  - [pr-open, ci, ok]
  - [pr-open, closed, close]
  - [build, fix, fail]
  - [build, scope-card, blocked]
  - [build, door, door-change]
  - [ci, review, pass]
  - [ci, fix, fail]
  - [review, design-scope, ok]
  - [design-scope, remote-ready, none]
  - [design-scope, designer, ui]
  - [design-scope, design-gap, gap]
  - [design-gap, design-scope, recapture]
  - [design-gap, design-gap-card, escalate]
  - [design-gap-card, design-scope, recapture]
  - [design-gap-card, spec, rescope]
  - [design-gap-card, parked, park]
  - [designer, remote-ready, ok]
  - [designer, fix, fail]
  - [remote-ready, build, rebase]
  - [build, build, rebase-more]
  - [remote-ready, closed, close]
  - [remote-ready, fix, fail]
  - - remote-ready
    - merge-card
    - ok
    - checks:
        - { use: firstmate/gate-branch }
        - { use: firstmate/gate-rebase }
        - { use: firstmate/gate-scope }
        - { use: firstmate/gate-failfirst }
        - { use: firstmate/gate-ci }
        - { use: firstmate/gate-approval }
        - { use: firstmate/gate-design }
  - [review, fix, fail]
  - [review, scope-card, blocked]
  - [step-back, fix, other-model]
  - [fix, build, retry|report]
  - [fix, ci, pass]
  - [fix, step-back, step-back]
  - [fix, stalled, stalled]
  - [fix, budget, cap]
  - [fix, door, door-change]
  - [step-back, spec, rescope]
  - [step-back, build, continue]
  - [step-back, parked, park]
  - [stalled, spec, rescope]
  - [stalled, build, continue]
  - [stalled, parked, park]
  - [budget, build, extend]
  - [budget, spec, rescope]
  - [budget, parked, park]
  - [scope-card, spec, rescope]
  - [scope-card, parked, park]
  - [merge-card, merge, merge]
  - [merge-card, fix, changes]
  - [merge-card, closed, close]
  - [merge, build, rebase]
  - [merge, after-merge]
  - [after-merge, cleanup]
  - [cleanup, done]
