id: self-update
version: 1.0.0
title: { en: "Self-update after the merge (dry run)", zh-TW: "合併後自我更新（演練）" }
description: "firstmate's after-merge self-update: back up local specs, fast-forward, reapply local config, reload the autopilot. In Studio it is a dry run against the run's own repository: it reports each step and changes nothing. It never touches firstmate."
applies_to: [run]
kind: hook
at: after_merge
needs: [merge_state]
params:
  type: object
  properties:
    dry_run: { type: boolean, default: true }
timeout_s: 60
network: false
