id: caller-coverage
version: 1.0.0
title: { en: "Every caller of a changed shared file has write or verification coverage", zh-TW: "變更共用檔的引用者都有修改或唯讀驗證範圍" }
applies_to: [spec, code-diff]
kind: deterministic
blocking: true
needs: [artifact]
params:
  type: object
  properties:
    exts: { type: array, default: [".js", ".mjs", ".ts", ".sh", ".py"] }
timeout_s: 60
network: false
