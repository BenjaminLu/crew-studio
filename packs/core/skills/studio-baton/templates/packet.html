<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
:root{
  /* Palette from the diagram-design style guide, so a diagram drawn by that
     skill and the page around it are one surface. Its role names map onto the
     variables the diagrams already reference. */
  --bg:#f5f5f5;        /* paper */
  --card:#ffffff;
  --card-2:#ececec;    /* paper-2 */
  --fg:#2d3142;        /* ink */
  --muted:#4f5d75;     /* blue-slate */
  --soft:#7a8399;
  --rule:rgba(45,49,66,.12);
  --rule-strong:#bfc0c0;   /* silver */
  --accent:#eb6c36;        /* atomic-tangerine — 1–2 focal points per diagram */
  --accent-tint:rgba(235,108,54,.08);
  --link:#2e5aa8;
  --amber:#b8915a;         /* mustard, from the series scale */
  --seal:#9c6b50;          /* rust-brown */
  --ok:#7c8f6f;            /* sage */
  /* Tone colours for small text and the fills behind it. The series tones
     above are for strokes; as text, or as a fill under white text, they fall
     below 4.5:1, so pins and tags use these instead. */
  --warn-ink:#7d5e34;--risk-ink:#a3432a;--ok-ink:#56684c;--on-ink:#ffffff;
  /* Native controls and scrollbars follow the theme: the OS one by default,
     the one a host stamps in data-theme when it sets one. */
  color-scheme:light dark;
  --shadow:0 1px 2px rgba(45,49,66,.06),0 10px 28px rgba(45,49,66,.06);

  /* A display serif, a text sans and a data mono — all from the system, so
     three real typographic roles cost nothing and never fall back silently. */
  --serif:"Songti TC","Songti SC","Noto Serif CJK TC","Source Han Serif TC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Noto Sans CJK TC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#2d3142;--card:#393e53;--card-2:#333849;--fg:#f5f5f5;--muted:#bfc0c0;
    --soft:#8e98ac;--rule:rgba(245,245,245,.12);--rule-strong:rgba(191,192,192,.25);
    --accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#6a95d8;
    --amber:#d3ad7a;--seal:#b88670;--ok:#9caf8f;
    --warn-ink:#d3ad7a;--risk-ink:#f39b84;--ok-ink:#a9bd9c;--on-ink:#2d3142;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4)}
}
:root[data-theme=dark]{color-scheme:dark;--bg:#2d3142;--card:#393e53;--card-2:#333849;--fg:#f5f5f5;--muted:#bfc0c0;
    --soft:#8e98ac;--rule:rgba(245,245,245,.12);--rule-strong:rgba(191,192,192,.25);
    --accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#6a95d8;
    --amber:#d3ad7a;--seal:#b88670;--ok:#9caf8f;
    --warn-ink:#d3ad7a;--risk-ink:#f39b84;--ok-ink:#a9bd9c;--on-ink:#2d3142;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4)}
:root[data-theme=light]{color-scheme:light;--bg:#f5f5f5;--card:#ffffff;--card-2:#ececec;--fg:#2d3142;--muted:#4f5d75;
  --soft:#7a8399;--rule:rgba(45,49,66,.12);--rule-strong:#bfc0c0;
  --accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--link:#2e5aa8;
  --amber:#b8915a;--seal:#9c6b50;--ok:#7c8f6f;
  --warn-ink:#7d5e34;--risk-ink:#a3432a;--ok-ink:#56684c;--on-ink:#ffffff;
  --shadow:0 1px 2px rgba(45,49,66,.06),0 10px 28px rgba(45,49,66,.06)}

/* One line scales the whole composition, so a 4K screen shows the same
   design larger rather than the same pixels stranded in the middle. */
html{font-size:clamp(16px,0.62vw + 12.4px,21px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:1rem;line-height:1.68;-webkit-font-smoothing:antialiased;
  padding:0 1.25rem 0 4.6rem}
main{max-width:78rem;margin:0 auto}

header.top{padding:3rem 0 1.5rem;border-bottom:2px solid var(--fg);margin-bottom:1.6rem;
  display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.7rem}
h1{font-family:var(--serif);font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:600;
  line-height:1.24;margin:0 0 .55rem;text-wrap:balance;letter-spacing:-.005em}
.lede{font-size:1.06rem;color:var(--muted);max-width:42rem;margin:0}
.lede strong{color:var(--fg);font-weight:600}
.langs{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:none}
.langs button{border:0;background:transparent;color:var(--muted);cursor:pointer;
  padding:.34rem .68rem;font:inherit;font-family:var(--mono);font-size:.72rem;
  transition:background .16s,color .16s}
.langs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* The palette legend sits under each diagram — it explains the drawing, so it
   lives with the drawing, not in the header two scrolls away. */
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin-top:.8rem;
  font-size:.76rem;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:.44rem}
.swatch{width:.7rem;height:.7rem;border-radius:2px;flex:0 0 auto}
.swatch.subj{background:var(--accent)}
.swatch.att{background:var(--amber)}
.swatch.term{background:var(--seal)}
.swatch.ctx{background:transparent;border:1.5px dashed var(--muted)}

/* The outline is a rail the reader brushes past, not a column that spends a
   fifth of every page on navigation. The ticks are always there — they say
   where you are and how much is left — and the full list slides out over the
   content on approach. The content keeps the whole width, which is what lets
   the figures and the type be read instead of squinted at. */
.stage{display:block}

.rail{position:fixed;left:0;top:0;bottom:0;z-index:40}
.rail-ticks{width:4.6rem;height:100%;display:flex;flex-direction:column;
  justify-content:center;gap:.3rem;padding:0 .8rem 0 .9rem;
  border-right:1px solid var(--rule);background:var(--bg)}
.rail-ticks button{font:inherit;font-family:var(--mono);font-size:.62rem;
  font-variant-numeric:tabular-nums;color:var(--soft);cursor:pointer;
  background:none;border:0;padding:.22rem 0;text-align:left;
  display:flex;align-items:center;gap:.4rem;transition:color .14s}
.rail-ticks button::after{content:"";flex:1;height:1px;background:var(--rule-strong);
  transition:background .14s,height .14s}
.rail-ticks button:hover{color:var(--fg)}
.rail-ticks button:hover::after{background:var(--fg)}
.rail-ticks button[aria-current=true]{color:var(--accent)}
.rail-ticks button[aria-current=true]::after{background:var(--accent);height:2px}
.rail-ticks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Off-canvas, never display:none — a tab into it opens it, so the list is
   reachable without a pointer. */
.outline{position:absolute;left:0;top:0;bottom:0;width:21rem;overflow-y:auto;
  background:var(--card);border-right:1px solid var(--rule);
  /* It floats over the content, so it needs an edge the content does not. */
  box-shadow:var(--shadow),14px 0 34px -12px rgba(0,0,0,.28);
  padding:1.6rem 1.2rem;transform:translateX(-101%);
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.rail:hover .outline,.rail:focus-within .outline,
.rail.open .outline{transform:none}

@media (max-width:56rem){
  body{padding-left:1.25rem}
  .rail{position:static}
  .rail-ticks{display:none}
  .outline{position:static;transform:none;width:auto;overflow:visible;
    border:1px solid var(--rule);border-radius:5px;padding:1rem;margin-bottom:1.3rem}
}
.outline h2,.panel h2{font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 .7rem;font-weight:700}
.outline ol{list-style:none;margin:0;padding:0;counter-reset:step}
.outline li{counter-increment:step}
.outline ol button{width:100%;text-align:left;font:inherit;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:4px;
  padding:.44rem .6rem .44rem .5rem;color:var(--fg);line-height:1.4;
  display:flex;gap:.6rem;align-items:baseline;
  transition:background .13s,border-color .13s}
.outline ol button::before{content:counter(step,decimal-leading-zero);
  font-family:var(--mono);font-size:.68rem;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none}
.outline ol button:hover{background:var(--card-2)}
.outline ol button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.outline ol button[aria-current=true]{background:var(--card);border-color:var(--accent);
  box-shadow:var(--shadow)}
.outline ol button[aria-current=true]::before{color:var(--accent)}
.outline .ttl{font-size:.88rem}

.panel{min-width:0}
.step{display:none}
.step.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step.on{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}

.card{background:var(--card);border:1px solid var(--rule);border-radius:5px;
  box-shadow:var(--shadow);padding:1.35rem 1.5rem}
.card h3{font-family:var(--serif);font-size:1.32rem;font-weight:600;line-height:1.3;
  margin:0 0 .35rem;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:0 0 1rem}
.lede-body{font-size:1.1rem;line-height:1.6;margin:0}
/* A name kept as a name. Translating `status_log` would cost the reader the
   word they need when they go and ask an engineer about it. */
code,.term{font-family:var(--mono);font-size:.875em;background:var(--card-2);
  padding:.08em .34em;border-radius:3px;word-break:break-word}
ul.findings code,ul.findings .term{font-size:.84em}

figure.fig{margin:0}
.figbody{background:var(--card);border:1px solid var(--rule);border-radius:5px;
  box-shadow:var(--shadow);padding:1.2rem;overflow-x:auto;text-align:center}
.figbody svg{max-width:100%;height:auto;display:inline-block}
figcaption{font-size:.85rem;color:var(--muted);margin-top:.75rem;line-height:1.55}

/* Prose that has been thought about. A section body is a sequence of blocks,
   not one grey slab: a sub-head where the argument turns, a measure short
   enough to track, and small figures inline — because a number belongs in a
   tile and a comparison in a bar, not in the third clause of a sentence. */
.prose{display:flex;flex-direction:column;gap:1.05rem}
.prose>h4{font-family:var(--serif);font-size:1.14rem;font-weight:600;
  margin:.5rem 0 -.45rem;line-height:1.34;text-wrap:balance}
.prose>h4:first-child{margin-top:0}
.prose>p{margin:0;font-size:1.05rem;line-height:1.68;max-width:46rem}
.prose>p.lead{font-size:1.2rem;line-height:1.56;max-width:44rem}
.prose .aside{border-left:3px solid var(--amber);background:var(--card-2);
  padding:.8rem 1.05rem;border-radius:3px;font-size:1rem;line-height:1.62;
  max-width:54rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem}
.stat{border:1px solid var(--rule);border-radius:4px;background:var(--card-2);
  padding:.8rem .95rem}
.stat .n{font-family:var(--serif);font-size:1.8rem;line-height:1.08;font-weight:600;
  font-variant-numeric:tabular-nums;display:block}
.stat .k{font-size:.84rem;color:var(--muted);line-height:1.45;display:block;
  margin-top:.35rem}
.stat.accent{border-color:var(--accent)} .stat.accent .n{color:var(--accent)}
.stat.warn{border-color:var(--amber)}   .stat.warn .n{color:var(--amber)}
.stat.seal{border-color:var(--seal)}    .stat.seal .n{color:var(--seal)}
.stat.ok{border-color:var(--ok)}        .stat.ok .n{color:var(--ok)}

.bars{display:flex;flex-direction:column;gap:.5rem}
.bars .b{display:grid;grid-template-columns:minmax(7rem,13rem) 1fr auto;gap:.8rem;
  align-items:center;font-size:.92rem}
.bars .bk{color:var(--muted);line-height:1.4}
.bars .bt{height:.66rem;border-radius:2px;background:var(--card-2);overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--muted);border-radius:2px}
.bars .b.accent .bt i{background:var(--accent)}
.bars .b.warn .bt i{background:var(--amber)}
.bars .b.ok .bt i{background:var(--ok)}
.bars .b.seal .bt i{background:var(--seal)}
.bars .bv{font-family:var(--mono);font-size:.76rem;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* Wider than a paragraph because of the label column, still a measure the
   eye can track back from. Figures may span; text may not. */
.kv{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.1rem;margin:0;
  font-size:.98rem;align-items:baseline;max-width:60rem}
.kv dt{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.kv dd{margin:0;line-height:1.6}

/* A finding is a row with a severity stripe, not a bullet: what needs
   attention has to read before the sentence does. */
ul.findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
ul.findings li{background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--rule-strong);border-radius:4px;
  padding:.8rem 1rem;font-size:.97rem;box-shadow:var(--shadow);
  opacity:0;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
ul.findings li.risk{border-left-color:var(--seal);background:var(--card)}
ul.findings li.warn{border-left-color:var(--amber)}
ul.findings li.ok{border-left-color:var(--accent)}
ul.findings .tag{display:block;font-family:var(--mono);font-size:.64rem;
  letter-spacing:.11em;text-transform:uppercase;margin-bottom:.28rem;color:var(--muted)}
ul.findings li.risk .tag{color:var(--seal)}
ul.findings li.warn .tag{color:var(--amber)}
ul.findings li.ok .tag{color:var(--accent)}

/* A vulnerability card: what the attack was, drawn, then problem and fix in
   plain rows. The reader should never need the PR's code to grasp either. */
.vuln-sev{display:inline-block;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.1em;text-transform:uppercase;padding:.12rem .5rem;border-radius:3px;
  font-weight:700;margin-bottom:.7rem}
.vuln-sev.p0{background:var(--seal);color:#fff}
.vuln-sev.p1{background:var(--amber);color:#fff}
.vuln-sev.p2{background:var(--rule-strong);color:var(--card)}
.vuln-pf{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;margin-top:1rem;
  align-items:baseline}
.vuln-pf dt{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;white-space:nowrap}
.vuln-pf dt.prob{color:var(--seal)} .vuln-pf dt.fix{color:var(--ok)}
.vuln-pf dd{margin:0;font-size:.97rem;line-height:1.55}
.vuln-ref{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:.7rem}
/* Code links stay quiet: the identifier is the link, nothing is added. */
#steps a{color:inherit;text-decoration:underline dotted var(--soft);text-underline-offset:3px}
#steps a:hover{color:var(--link);text-decoration-color:var(--link)}
#steps a code{text-decoration:inherit}

/* Transactions-as-transactions: each state edge is one DB transaction. An
   envelope groups the writes that commit together; anything outside it is
   marked, because "also a write" is the trap the reference page is built to
   expose. */
.txn{border:2px solid var(--accent);border-radius:5px;overflow:hidden;margin:0 0 1rem;
  background:var(--card);box-shadow:var(--shadow)}
.txn>.cap{background:var(--accent);color:#fff;padding:.5rem .9rem;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;font-weight:700;
  display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.txn>.cap .method{opacity:.9;font-weight:500}
.txn .rows{padding:.5rem .9rem .9rem}
.txn .foot{padding:.6rem .9rem;border-top:1px dashed var(--rule);background:var(--card-2);
  font-size:.85rem;color:var(--muted)}
.rowblock{margin-top:.85rem}
.rowblock .rhead{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin-bottom:.3rem}
.rowblock .tbl{font-family:var(--mono);font-size:.82rem;font-weight:700}
.op{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;padding:.05rem .38rem;
  border-radius:3px;border:1px solid var(--rule);color:var(--muted);text-transform:uppercase}
.op.ins{border-color:var(--accent);color:var(--accent)}
.op.upd{border-color:var(--amber);color:var(--amber)}
.rowblock .guard{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
table.fields{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.25rem}
table.fields td{padding:.3rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.fields tr:last-child td{border-bottom:none}
table.fields .k{font-family:var(--mono);font-size:.78rem;white-space:nowrap;width:1%;color:var(--muted)}
table.fields .v{font-family:var(--mono);font-size:.78rem;word-break:break-word}
table.fields .was{color:var(--muted);text-decoration:line-through;margin-right:.4rem}
table.fields .now{color:var(--fg);font-weight:600}
table.fields .now.ver{color:var(--amber)} table.fields .now.term{color:var(--seal)}
.outside{border:1.5px dashed var(--muted);border-radius:5px;padding:.7rem .9rem;margin-top:.75rem}
.outside .ocap{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.4rem}
.outside ul{margin:0;padding-left:1.1em;font-size:.86rem} .outside li{margin:.3rem 0}
.takeaway{border-left:3px solid var(--seal);background:var(--card-2);padding:.7rem .95rem;
  border-radius:3px;margin-top:.85rem;font-size:.92rem}

/* Arrows draw in so the eye follows the system's order instead of landing on
   a finished tangle. */
.figbody svg path[data-edge]{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:draw .68s cubic-bezier(.3,.8,.4,1) forwards}
.figbody svg rect[data-node]{opacity:0;animation:pop .34s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Interactive state map: click a state, see the DB transaction that produced
   it, and which rollout stage it sits in. */
.smap .figbody svg [data-node]{cursor:pointer;transition:opacity .15s}
.smap .figbody svg [data-node]:hover{opacity:.72}
.smap .figbody svg [data-node].picked{outline:none}
/* A shape with nothing behind it must not invite a click it cannot answer. */
.smap .figbody svg [data-node].inert{cursor:default}
.smap .figbody svg [data-node].inert:hover{opacity:1}
.smap-stages{display:flex;gap:.4rem;margin:.9rem 0;flex-wrap:wrap}
.smap-stage{flex:1;min-width:7rem;text-align:center;font-family:var(--mono);
  cursor:pointer;
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:5px;padding:.5rem .3rem;transition:all .2s}
.smap-stage:hover:not(.empty){border-color:var(--accent);color:var(--accent)}
.smap-stage.on{border-color:var(--accent);color:var(--accent);background:var(--card-2);font-weight:700}
.smap-stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* A stage no state belongs to is shown, but plainly not a control. */
.smap-stage.empty{cursor:default;opacity:.45}
.smap-hint{color:var(--muted);font-size:.82rem;margin:.2rem 0 0}
.smap-detail{margin-top:1rem;min-height:2rem}
.smap-detail:empty::before{content:attr(data-empty);color:var(--muted);font-size:.9rem}

.nav{display:flex;gap:.5rem;margin-top:1.1rem;align-items:center}
button.act{font:inherit;font-size:.86rem;padding:.44rem .95rem;border-radius:4px;
  border:1px solid var(--rule);background:var(--card);color:var(--fg);cursor:pointer;
  transition:border-color .16s,background .16s}
button.act:hover:not(:disabled){border-color:var(--accent)}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.act:disabled{opacity:.4;cursor:default}
.tick{font-family:var(--mono);font-size:.74rem;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-left:.3rem}

/* The handoff is the point of the document, so it is a standing block at the
   end of the outline rather than something to scroll for. */
.handoff{margin-top:1.7rem;border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:4px;background:var(--card-2);padding:1.05rem 1.2rem;
  display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap}
.handoff .txt{flex:1 1 24rem;min-width:0}
.handoff .cap{font-family:var(--mono);font-size:.64rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.35rem}
.handoff p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.55}
.handoff .row{display:flex;gap:.4rem;flex-wrap:wrap;flex:0 1 auto;min-width:0}

/* ---- Components (v2): every label is HTML in rem, never text inside a scaled SVG ---- */
.kcard{background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);
  padding:1.25rem 1.35rem 1.35rem}
.kcard>h3{font-family:var(--serif);font-size:1.32rem;font-weight:600;line-height:1.3;margin:0 0 .35rem}
.kcard>.cap{font-size:.95rem;color:var(--muted);line-height:1.55;margin:0 0 1rem}
.kcard>.claim{font-size:1.02rem;line-height:1.55;margin:.35rem 0 1rem}
.kcard>.claim b{color:var(--accent)}
/* A tag is a label, not a control: tone-coloured text with a small mark, no
   fill and no box, so it never reads as a button next to one. */
.ktag{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;color:var(--muted);margin-right:.6rem;cursor:default;user-select:text}
.ktag::before{content:"";width:.5rem;height:.5rem;border-radius:1px;background:currentColor;flex:0 0 auto}
.ktag.risk{color:var(--risk-ink)} .ktag.warn{color:var(--warn-ink)} .ktag.ok{color:var(--ok-ink)}
/* chain: the same component chain twice, broken hop vs changed hop */
.chain{display:grid;gap:.9rem;grid-template-columns:minmax(0,1fr)}
.lane{border:1px solid var(--rule);border-left:4px solid var(--amber);border-radius:6px;
  background:var(--card);padding:.85rem 1rem 1rem}
.lane.seal{border-left-color:var(--seal)} .lane.after{border-left-color:var(--ok)}
.lane .lt{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 .7rem;font-weight:700}
.cgrid{display:grid;align-items:stretch;row-gap:.6rem}
.cnode{border:1.5px solid var(--rule-strong);border-radius:8px;padding:.6rem .65rem;background:var(--card-2);
  min-height:4.4rem;display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:0}
/* break-word, not anywhere: the column's min-content then stops at the <wbr>
   points (after / _ .), so a name breaks there and not mid-word; a single
   segment wider than its box still breaks as the last resort. */
.cnode .nm{font-weight:650;font-size:.98rem;line-height:1.3;overflow-wrap:break-word}
/* Six or more boxes side by side: tighter boxes, a smaller name, and hop
   labels never under 12px. Side by side only; stacked boxes are full width. */
@media (min-width:56.01rem){
  .cgrid.dense .cnode{padding:.55rem .3rem} .cgrid.dense .cnode .nm{font-size:.78rem}
  .cgrid.dense .carrow .hl{font-size:max(12px,.62rem)}
  .cgrid.dense .cnode .sb{font-size:max(12px,.68rem)} .cgrid.dense .cnode .sb.tx{font-size:.72rem}
}
/* A narrow desktop (about 900–1280px) gives every side-by-side lane the
   same tighter step, so names keep their / _ . break points there too. */
@media (min-width:56.01rem) and (max-width:80rem){
  .cgrid .cnode{padding:.55rem .3rem} .cgrid .cnode .nm{font-size:.78rem}
  .cgrid .carrow .hl{font-size:max(12px,.62rem)}
  .cgrid .cnode .sb{font-size:max(12px,.68rem)} .cgrid .cnode .sb.tx{font-size:.72rem}
}
/* Code inside a box breaks at its <wbr> points like the text around it; the
   global word-break:break-word would let it split anywhere and shrink the
   column's min-content to one letter. */
.cnode code,.cout code{word-break:normal;overflow-wrap:break-word}
.cout>span{min-width:0;max-width:100%}
.cnode .sb{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-top:.3rem;line-height:1.4;overflow-wrap:break-word}
.cnode .sb.tx{font-family:var(--sans);font-size:.86rem}
.cnode.k-client{border-style:dashed}
.cnode.k-store{border-radius:10px/18px}
.cnode.k-external{outline:1px solid var(--rule-strong);outline-offset:-5px}
.cnode.bad{border:2px solid var(--amber);background:var(--card)} .lane.seal .cnode.bad{border-color:var(--seal)}
.cnode.good{border:2px solid var(--accent);background:var(--accent-tint)}
.cnode.bad .nm::before{content:"✕ ";color:var(--amber)} .cnode.good .nm::before{content:"● ";color:var(--accent)}
.carrow{--ac:var(--rule-strong);align-self:center;display:flex;flex-direction:column;align-items:center;padding:0 .25rem;min-width:0}
/* One colour per arrow, read by the line and its head alike, so a head can
   never come out two-tone. */
.carrow.bad,.carrow.end{--ac:var(--amber)} .carrow.good{--ac:var(--accent)}
.lane.after .carrow.end{--ac:var(--ok)} .carrow.okl{--ac:var(--ok)}
.carrow .hl{font-family:var(--mono);font-size:max(12px,.68rem);color:var(--muted);text-align:center;line-height:1.25;
  margin-bottom:.2rem;word-break:keep-all;overflow-wrap:break-word;max-width:100%}
.carrow .ln{width:100%;min-width:1.6rem;height:0;border-top:2px solid var(--ac);position:relative}
.carrow .ln::after{content:"";position:absolute;right:-2px;top:-7px;border:6px solid transparent;
  border-left:9px solid var(--ac);border-right:0}
.cout{border:2px solid var(--amber);border-radius:8px;padding:.6rem .75rem;font-weight:700;font-size:1rem;
  line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;min-height:4.4rem;
  min-width:0;overflow-wrap:break-word}
.lane.seal .cout{border-color:var(--seal)} .lane.after .cout{border-color:var(--ok)}
.callout{position:relative;border:1px solid var(--amber);border-radius:6px;background:var(--card-2);
  padding:.55rem .75rem;font-size:.92rem;line-height:1.55;margin-top:.35rem}
.callout::before{content:"";position:absolute;top:-8px;left:var(--px,2.5rem);border:7px solid transparent;
  border-top:0;border-bottom:8px solid var(--amber)}
.callout.r::before{left:auto;right:var(--px,2.5rem)}
.lane.after .callout{border-color:var(--accent)} .lane.after .callout::before{border-bottom-color:var(--accent)}
.callout .why{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);font-weight:700;margin-right:.35rem}
.lane.after .callout .why{color:var(--accent)}
.proof{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-top:.2rem}
.proof .pl{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-right:.2rem}
.pchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--rule-strong);border-radius:999px;
  padding:.22rem .65rem;font-size:.82rem;line-height:1.3;background:var(--card)}
.pchip i{width:.55rem;height:.55rem;border-radius:50%;background:var(--rule-strong);flex:0 0 auto}
.pchip.verified i{background:var(--ok)} .pchip.code-only i{background:var(--amber)} .pchip.absent i{background:var(--seal)}
.pchip.absent{border-style:dashed}
.pchip.unknown{border-style:dotted} .pchip.unknown i{background:none;border:1.5px solid var(--muted)}
.pchip .ps{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  border-left:1px solid var(--rule-strong);padding-left:.4rem}
.pchip .pt{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* boundary map */
.bmap .cnode{position:relative}
.badge{position:absolute;top:-.6rem;right:-.6rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--warn-ink);
  color:var(--on-ink);font:700 .8rem/1.5rem var(--mono);text-align:center;box-shadow:0 0 0 2px var(--card);flex:0 0 auto}
.badge.risk{background:var(--risk-ink)}
.carrow .badge{position:static;display:inline-block;margin-bottom:.2rem}
.carrow.okl .hl::after{content:" ✓";color:var(--ok-ink)}
.bfind{display:grid;gap:.6rem;margin-top:1rem}
.bfind .bf{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .7rem}
.bfind .badge{position:static}
.bfind .ktag{margin-right:0}
.bfind .ttl{line-height:1.5;flex:1 1 16rem;min-width:0}
.bfind button{font:inherit;font-size:.8rem;border:1px solid var(--rule-strong);background:var(--card-2);color:var(--fg);
  border-radius:4px;padding:.25rem .6rem;cursor:pointer;white-space:nowrap}
.bok{margin-top:1rem;border:1px solid var(--ok);border-left:4px solid var(--ok);border-radius:6px;padding:.7rem .9rem;
  line-height:1.55}
.bok::before{content:"✓ ";color:var(--ok);font-weight:700}
/* compare (from → to) */
/* A table wider than its card scrolls inside this box, never the page. */
.tscroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tscroll:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.tscroll>table{min-width:100%}
table.mtx td:first-child{min-width:8.5rem}
table.cmp,table.mtx{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem}
table.cmp th,table.mtx th{font-size:.8rem;font-weight:600;color:var(--muted);text-align:left;padding:.45rem .6rem;
  border-bottom:1px solid var(--rule-strong)}
table.cmp td,table.mtx td{padding:.65rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.5}
table.cmp td.dim{font-weight:650;white-space:nowrap}
table.cmp td.from{color:var(--muted);font-style:italic}
table.cmp td.arr{color:var(--accent);font-weight:700;padding:.65rem .2rem}
table.cmp td.to{font-weight:600}
table.mtx td.c,table.mtx th.c{text-align:center}
.mk{display:inline-flex;width:1.55rem;height:1.55rem;border-radius:50%;border:2px solid;align-items:center;
  justify-content:center;font:700 .8rem var(--mono)}
.mk.have{color:var(--ok)} .mk.part{color:var(--amber)} .mk.gap{color:var(--seal)} .mk.plan{color:var(--accent)} .mk.na{color:var(--soft)}
.mlegend{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.8rem;font-size:.85rem;color:var(--muted);align-items:center}
.mlegend span{display:inline-flex;gap:.4rem;align-items:center}
/* steps (horizontal flow, arrows automatic) */
.hflow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6rem}
.hstep{position:relative;border:1px solid var(--rule);border-top:3px solid var(--rule-strong);border-radius:6px;
  background:var(--card-2);padding:.75rem .85rem}
.hstep.accent{border-top-color:var(--accent)} .hstep.warn{border-top-color:var(--amber)} .hstep.ok{border-top-color:var(--ok)}
.hstep + .hstep::before{content:"→";position:absolute;left:-1.3rem;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.hstep .fn{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hstep b{display:block;font-size:1rem;margin:.25rem 0}
.hstep p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.5}
/* chart: categorical slots validated (dataviz validate_palette.js) on this page's
   card surfaces — light #ffffff, dark #393e53; contrast WARN → table view always ships */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--grid:rgba(45,49,66,.10)}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--grid:rgba(245,245,245,.10)}}
:root[data-theme=dark]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--grid:rgba(245,245,245,.10)}
:root[data-theme=light]{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--grid:rgba(45,49,66,.10)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--rule-strong);
  border-radius:6px;box-shadow:var(--shadow);padding:.45rem .6rem;font-size:.82rem;line-height:1.45;opacity:0;
  transition:opacity .12s;min-width:8rem;z-index:3}
.chart .tip.on{opacity:1}
.chart .tip .tx{color:var(--muted);font-size:.74rem;margin-bottom:.2rem}
.chart .tip .r{display:flex;align-items:center;gap:.45rem}
.chart .tip .r i{width:.9rem;height:2px;border-radius:1px;flex:0 0 auto}
.chart .tip .r b{font-variant-numeric:tabular-nums}
.chart .tip .r span{color:var(--muted)}
.clegend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin:.2rem 0 .6rem;font-size:.85rem;color:var(--muted)}
.clegend span{display:inline-flex;align-items:center;gap:.45rem}
.clegend i{display:inline-block;width:.75rem;height:.75rem;border-radius:2px}
.clegend i.ln{height:2px;width:1rem;border-radius:1px}
.csrc{font-size:.8rem;color:var(--muted);margin-top:.55rem}
.csrc b{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;margin-right:.35rem}
details.ctable{margin-top:.5rem;font-size:.85rem}
details.ctable summary{cursor:pointer;color:var(--muted);font-size:.8rem}
details.ctable table{margin-top:.4rem}
details.ctable td,details.ctable th{font-variant-numeric:tabular-nums}
.chart .hit:focus{outline:2px solid var(--link);outline-offset:1px}
.spark{display:block;margin-top:.35rem}
@media (max-width:56rem){
  .cgrid{display:flex!important;flex-direction:column}
  /* Stacked: the line runs down the middle under the node above it; the hop
     label sits right of it and any pin left of it, both centred on the line. */
  .carrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:.6rem;min-height:1.8rem;padding:0}
  .carrow .ln{grid-column:2;grid-row:1;width:0;min-width:0;height:1.4rem;border-top:0;border-left:2px solid var(--ac)}
  .carrow .ln::after{right:auto;left:-7px;top:auto;bottom:-3px;border:6px solid transparent;border-top:9px solid var(--ac);border-bottom:0}
  .carrow .hl{grid-column:3;grid-row:1;justify-self:start;text-align:left;margin:0}
  .carrow .badge{grid-column:1;grid-row:1;justify-self:end;margin:0}
  .callout::before{left:2rem!important;right:auto!important}
  .hflow{grid-auto-flow:row}
  .hstep + .hstep::before{content:"↓";left:50%;top:-1.35rem;transform:translateX(-50%)}

  .figbody svg rect[data-node]{opacity:1!important;animation:none!important}
  body{background:var(--bg)!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
body.baton-printing .rail,
body.baton-printing .langs,
body.baton-printing .nav,

body.baton-printing .step{display:block!important;animation:none!important;margin-bottom:2rem}
button.act.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}

  background:var(--card);color:var(--fg);width:min(54rem,92vw);max-height:84vh;

  line-height:1.6;color:var(--fg);background:var(--bg);border:1px solid var(--rule);
  border-radius:4px;padding:.85rem;resize:vertical;white-space:pre;overflow:auto}

  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important}
}

        const show=()=>showTip(lw+w, y, xs[j], [{c:SLOT[0], v:fmt(val,u), n:j>0&&v[j-1]>0? (val/v[j-1]*100).toFixed(1)+'% '+pick(CL.conv,lang):''}]);
        hit.addEventListener('pointermove',show); hit.addEventListener('focus',show);
        hit.addEventListener('pointerleave',hideTip); hit.addEventListener('blur',hideTip);
        svg.appendChild(hit);
      });
      plot.appendChild(svg); return;
    }
    const H=290, m={l:52,r:s.type==='line'?140:16,t:14,b:34}, iw=W-m.l-m.r, ih=H-m.t-m.b;
    const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img'});
    const stacked=s.type==='stacked';
    const tot=xs.map((_,j)=>ser.reduce((a,se)=>a+(+se.values[j]||0),0));
    const dataMax=stacked? Math.max.apply(null,tot) : Math.max.apply(null,ser.flatMap(se=>se.values.map(Number)));
    const ymax=niceMax(s.ymax||dataMax); const Y=v=>m.t+ih-(v/ymax)*ih;
    const NT=(ymax/4)%1===0?4:((ymax/5)%1===0?5:4);
    for(let k=0;k<=NT;k++){ const v=ymax*k/NT, y=Y(v);
      svg.appendChild(svgEl('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:k?'var(--grid)':'var(--rule-strong)','stroke-width':1}));
      svg.appendChild(txt(m.l-8,y+4,fmt(v,u),{'text-anchor':'end','font-variant-numeric':'tabular-nums'})); }
    const n=xs.length, band=iw/Math.max(1,n);
    const every=Math.ceil(n/Math.max(1,Math.floor(iw/72)));
    xs.forEach((x,j)=>{ if(j%every===0) svg.appendChild(txt(m.l+band*(j+.5),H-12,x,{'text-anchor':'middle'})); });
    if(s.type==='line'){
      const X=j=>m.l+band*(j+.5);
      ser.forEach((se,i)=>{
        const d=se.values.map((v,j)=>(j?'L':'M')+X(j).toFixed(1)+' '+Y(+v).toFixed(1)).join(' ');
        svg.appendChild(svgEl('path',{d,fill:'none',stroke:SLOT[i],'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
        const lj=se.values.length-1, ly=Y(+se.values[lj]);
        svg.appendChild(svgEl('circle',{cx:X(lj),cy:ly,r:4,fill:SLOT[i],stroke:'var(--card)','stroke-width':2}));
        if(ser.length<=4) svg.appendChild(txt(X(lj)+10,ly+4,pick(se.name,lang)+' '+fmt(+se.values[lj],u),{fill:'var(--fg)'}));
      });
      (s.marks||[]).forEach(mk=>{ const x=X(mk.at);
        svg.appendChild(svgEl('line',{x1:x,x2:x,y1:m.t,y2:m.t+ih,stroke:'var(--rule-strong)','stroke-width':1}));
        svg.appendChild(txt(x+4,m.t+10,pick(mk.label,lang),{'font-size':11})); });
      const cross=svgEl('line',{y1:m.t,y2:m.t+ih,stroke:'var(--soft)','stroke-width':1,opacity:0});
      svg.appendChild(cross);
      const ov=svgEl('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent',class:'hit',tabindex:0});
      let fj=n-1;
      const at=j=>{ j=Math.max(0,Math.min(n-1,j)); fj=j; const x=X(j); cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('opacity',1);
        showTip(x, m.t, xs[j], ser.map((se,i)=>({c:SLOT[i],v:fmt(+se.values[j],u),n:pick(se.name,lang)}))); };
      ov.addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*(W/r.width);
        at(Math.round((px-m.l)/band-.5)); });
      ov.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') at(fj-1); if(e.key==='ArrowRight') at(fj+1); });
      ov.addEventListener('focus',()=>at(fj));
      const off=()=>{ cross.setAttribute('opacity',0); hideTip(); };
      ov.addEventListener('pointerleave',off); ov.addEventListener('blur',off);
      svg.appendChild(ov);
    } else {
      const k=stacked?1:ser.length, bwid=Math.min(24,(band*.7-(k-1)*2)/k);
      xs.forEach((x,j)=>{
        let base=0; const cx=m.l+band*(j+.5);
        ser.forEach((se,i)=>{
          const v=+se.values[j]||0; if(v<=0 && stacked) return;
          const x0=stacked? cx-bwid/2 : cx-(k*bwid+(k-1)*2)/2+i*(bwid+2);
          const y1=Y(base+v), y0=Y(base), hgt=Math.max(0,y0-y1-(stacked&&base>0?2:0));
          const isTop=!stacked || ser.slice(i+1).every(o=>!(+o.values[j]>0));
          const r=isTop?Math.min(4,hgt,bwid/2):0;
          const d='M'+x0+' '+(y0-(stacked&&base>0?2:0))+'v'+(-(hgt-r))+(r?'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'h'+(bwid-2*r)+'a'+r+' '+r+' 0 0 1 '+r+' '+r:'h'+bwid)+'v'+(hgt-r)+'z';
          const p=svgEl('path',{d,fill:SLOT[i],class:'hit',tabindex:0}); svg.appendChild(p);
          const show=()=>showTip(x0+bwid, y1, x, stacked? ser.map((o,q)=>({c:SLOT[q],v:fmt(+o.values[j],u),n:pick(o.name,lang)})).concat([{c:'transparent',v:fmt(tot[j],u),n:pick(CL.total,lang)}])
                                                         : [{c:SLOT[i],v:fmt(v,u),n:pick(se.name,lang)}]);
          p.addEventListener('pointermove',show); p.addEventListener('focus',show);
          p.addEventListener('pointerleave',hideTip); p.addEventListener('blur',hideTip);
          if(stacked) base+=v;
        });
        if(ser.length===1 || stacked){ const top=stacked?tot[j]:+ser[0].values[j];
          svg.appendChild(txt(cx,Y(top)-6,fmt(top,u),{'text-anchor':'middle',fill:'var(--fg)','font-size':11.5})); }
      });
    }
    plot.appendChild(svg);
  }
  const KR={chain:chainHTML, boundary:boundaryHTML, compare:compareHTML, matrix:matrixHTML, steps:stepsHTML, stats:statsHTML, chart:chartHTML};

  function build(s){
    const el=document.createElement('article'); el.className='step';
    if (KR[s.kind]){
      const c=document.createElement('div'); c.className='kcard';
      const h=document.createElement('h3'); h.dataset.i='heading'; c.appendChild(h);
      if(s.tag||s.severity){ const t=document.createElement('span'); t.className='ktag '+(s.tone||'warn');
        t.textContent=s.tag||s.severity; c.insertBefore(t,h); }
      if(s.claim){ const p=document.createElement('p'); p.className='claim'; p.dataset.i='claim'; c.appendChild(p); }
      if(s.caption){ const p=document.createElement('p'); p.className='cap'; p.dataset.i='caption'; c.appendChild(p); }

    }
    if (s.kind==='figure'){
      const f=document.createElement('figure'); f.className='fig';

      head.appendChild(h);
      const sub=document.createElement('p'); sub.className='sub'; sub.dataset.i='caption';
      sub.style.margin='0'; head.appendChild(sub);
      const body=document.createElement('div'); body.className='figbody';
      body.append(safeSVG(s.svg));
      const lg=document.createElement('div'); lg.className='legend';
      f.append(head,body,lg); el.appendChild(f);
    } else if (s.kind==='statemap'){
      el.classList.add('smap');
      const f=document.createElement('figure'); f.className='fig';
      const head=document.createElement('div'); head.className='card';
      head.style.marginBottom='.9rem';
      const h=document.createElement('h3'); h.dataset.i='heading'; head.appendChild(h);
      const sub=document.createElement('p'); sub.className='sub'; sub.dataset.i='caption';
      sub.style.margin='0'; head.appendChild(sub);
      const body=document.createElement('div'); body.className='figbody';
      body.append(safeSVG(s.svg));
      const stages=document.createElement('div'); stages.className='smap-stages';
      ['expand','backfill','cutover','contract'].forEach(k=>{
        const d=document.createElement('button'); d.type='button';
        d.className='smap-stage'; d.dataset.stage=k;
        d.textContent={expand:'add',backfill:'fill in',cutover:'switch over',contract:'remove'}[k];
        stages.appendChild(d);
      });
      const hint=document.createElement('p'); hint.className='smap-hint'; hint.dataset.i='hint';
      const detail=document.createElement('div'); detail.className='smap-detail';
      detail.dataset.sec=String(secs.indexOf(s));
      const lg=document.createElement('div'); lg.className='legend';
      f.append(head,body,lg,stages,hint,detail); el.appendChild(f);
    } else if (s.kind==='points'){
      const h=document.createElement('h2'); h.dataset.i='heading'; el.appendChild(h);
      const ul=document.createElement('ul'); ul.className='findings';
      (s.items||[]).forEach((it,i)=>{
        const li=document.createElement('li');
        li.className=it.tone||''; li.style.animationDelay=(i*80)+'ms';
        const tag=document.createElement('span'); tag.className='tag';
        // The tone sets the colour; the words default to a migration packet's
        // vocabulary and a packet may override them, because "cannot be undone"
        // is a lie on a finding that is a contradiction rather than a deletion.
        tag.textContent=it.tag||
          {risk:'cannot be undone',warn:'needs attention',ok:'checked'}[it.tone]||'note';
        const sp=document.createElement('span'); sp.dataset.item=String(i);
        sp.dataset.rich='1';
        li.append(tag,sp); ul.appendChild(li);
      });
      el.appendChild(ul);
    } else if (s.kind==='vuln'){
      const h=document.createElement('h3'); h.dataset.i='heading';
      h.style.cssText='font-family:var(--serif);font-size:1.32rem;margin:0 0 .5rem';
      el.appendChild(h);
      // severity chip (static) + the attack diagram (inline svg) +
      // the problem/fix text (rebuilt per language). The diagram is a sibling,
      // not inside the rebuilt box, so a language switch never wipes it.
      const sev=(s.severity||'p1').toLowerCase();
      const chip=document.createElement('span');
      chip.className='vuln-sev '+sev;
      chip.textContent={p0:'P0 · remote',p1:'P1 · high',p2:'P2 · medium'}[sev]||sev;
      el.appendChild(chip);

        const fig=document.createElement('div'); fig.className='figbody';

        const lg=document.createElement('div'); lg.className='legend'; el.appendChild(lg);
      }
      const box=document.createElement('div'); box.className='vulnbox';
      box.dataset.sec=String(secs.indexOf(s)); el.appendChild(box);
    } else if (s.kind==='txn'){
      const h=document.createElement('h3'); h.dataset.i='heading';
      h.style.fontFamily='var(--serif)'; h.style.fontSize='1.32rem';
      h.style.margin='0 0 .35rem'; el.appendChild(h);
      const lead=document.createElement('p'); lead.className='lede-body';
      lead.dataset.i='text'; lead.style.margin='0 0 1rem'; lead.style.fontSize='1rem';
      el.appendChild(lead);
      const box=document.createElement('div'); box.className='txnbox';

  const host=document.getElementById('steps');
  const built=secs.map(build);
  built.forEach(e=>host.appendChild(e));

  function animate(el){
    el.querySelectorAll('svg path[data-edge]').forEach((p,i)=>{
      let len=600; try{len=Math.max(20,p.getTotalLength());}catch(e){}
      p.style.setProperty('--len',len);
      p.style.animationDelay=(120+i*70)+'ms';
    });
    el.querySelectorAll('svg rect[data-node]').forEach((r,i)=>{
      r.style.animationDelay=(i*50)+'ms';
    });
  }

  // A section body is either one string or a sequence of blocks. Blocks exist
  // because an argument that turns three times reads as one grey slab
  // otherwise — and because a number belongs in a tile and a comparison in a
  // bar, not buried in the third clause of a sentence.
  //   {h}  sub-head        {p}  paragraph (+lead)   {note} aside
  //   {stats:[{n,k,tone}]}  {bars:{rows:[{k,v,label,tone}]}}  {kv:[[k,v]]}
  // 12-ish point trend under a stat: de-emphasis line, current point in the accent.
  function spark(tr){
    if(!Array.isArray(tr)||tr.length<2) return '';
    const w=120,h=26,mn=Math.min.apply(null,tr),mx=Math.max.apply(null,tr),r=(mx-mn)||1;
    const pts=tr.map((v,i)=>[(i/(tr.length-1))*(w-6)+3, h-3-((v-mn)/r)*(h-6)]);
    const last=pts[pts.length-1];
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
      '<polyline points="'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--soft)" stroke-width="1.5" stroke-linejoin="round"/>'+
      '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="var(--accent)"/></svg>';
  }
  function proseHTML(v, lang){
    if(v==null) return '';
    const blocks = Array.isArray(v) ? v : [{p:v}];
    let h='';
    blocks.forEach(b=>{
      if(b==null) return;
      if(b.h!=null){ h+='<h4>'+rich(pick(b.h,lang))+'</h4>'; return; }
      if(b.note!=null){ h+='<div class="aside">'+rich(pick(b.note,lang))+'</div>'; return; }
      if(b.stats){
        h+='<div class="stats">'+b.stats.map(t=>
          '<div class="stat '+E(t.tone||'')+'"><span class="n">'+E(t.n)+'</span>'+
          '<span class="k">'+rich(pick(t.k,lang))+'</span>'+spark(t.trend)+'</div>').join('')+'</div>';
        return;
      }
      if(b.bars){
        const rows=b.bars.rows||[];
        // Bars are relative to the largest row, so the shape is honest even
        // when the caller never states a scale.
        const max=Math.max.apply(null,rows.map(r=>Math.abs(+r.v)||0).concat([1]));
        h+='<div class="bars">'+rows.map(r=>
          '<div class="b '+E(r.tone||'')+'"><span class="bk">'+rich(pick(r.k,lang))+'</span>'+
          '<span class="bt"><i style="width:'+
            Math.max(2,Math.round((Math.abs(+r.v)||0)/max*100))+'%"></i></span>'+
          '<span class="bv">'+E(r.label!=null?r.label:r.v)+'</span></div>').join('')+'</div>';
        return;
      }
      if(b.kv){
        h+='<dl class="kv">'+b.kv.map(r=>
          '<dt>'+E(pick(r[0],lang))+'</dt><dd>'+rich(pick(r[1],lang))+'</dd>').join('')+'</dl>';
        return;
      }
      if(b.p!=null) h+='<p'+(b.lead?' class="lead"':'')+'>'+rich(pick(b.p,lang))+'</p>';
    });
    return h;
  }

  // Honour exactly three marks: [label](url), `code`, **lead-in**.
  // Packet text comes from untrusted sources (a PR body, a review comment).
  // A link's URL is taken from the raw text, checked against an allow-list and
  // attribute-escaped; a refused link stays as plain text. verify.py applies
  // the same rule (LINK / safe_href) and fails a packet that carries one.
  const LINK=/\[([^\]\n]+)\]\(([^)\t\n\x0b\f\r ]+)\)/g;   // same class as verify.py
  // Default-deny: only http(s):// and mailto: become links. Any control
  // character or space anywhere refuses the URL, because browsers strip
  // leading C0 controls and tabs/newlines inside, so "\u0001javascript:"
  // would otherwise run as javascript:.
  function safeHref(u){
    if(/[\x00-\x20\x7f]/.test(u)) return null;
    return /^(https?:\/\/|mailto:)/i.test(u) ? u : null;
  }
  function inline(t){
    return E(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  }
  function rich(v){
    const s=String(v==null?'':v); let out='', at=0, m;
    LINK.lastIndex=0;
    while((m=LINK.exec(s))){
      const href=safeHref(m[2]); if(href==null) continue;
      out+=inline(s.slice(at,m.index))+'<a href="'+E(href)+'" target="_blank" rel="noopener noreferrer">'+
        inline(m[1])+'</a>';
      at=m.index+m[0].length;
    }
    return out+inline(s.slice(at));
  }

  function paint(){
    const t=T[lang];
    document.documentElement.lang = lang==='en'?'en':(lang==='hant'?'zh-Hant':'zh-Hans');
    document.getElementById('eyebrow').textContent =
      [D.repo,D.branch,D.range].filter(Boolean).join('  ·  ');
    document.getElementById('title').textContent = pick(D.title,lang);
    document.getElementById('sub').textContent = pick(D.subtitle,lang);
    const lgHTML = ['subj','att','term','ctx'].map((c,i)=>
      '<span><i class="swatch '+c+'"></i>'+t.lg[i]+'</span>').join('');
    document.querySelectorAll('.legend').forEach(el=>{el.innerHTML=lgHTML;});
    document.getElementById('outline-h').textContent=t.outline;
    document.getElementById('ho-cap').textContent=t.hocap;
    document.getElementById('ho-help').textContent=t.hohelp;
    document.getElementById('cp').textContent=t.cp;
    document.getElementById('raw').textContent=t.raw;
    document.getElementById('dl').textContent=t.dl;
    document.getElementById('pdf').textContent=t.pdf;
    document.getElementById('rawtitle').textContent=t.rawtitle;
    document.getElementById('rawhelp').textContent=t.rawhelp;
    document.getElementById('prev').textContent=t.prev;
    document.getElementById('next').textContent=t.next;
    document.getElementById('tick').textContent=t.of(idx+1,secs.length);

    built.forEach((el,i)=>{
      const s=secs[i];
      const box=el.querySelector('.txnbox');
      if(box) box.innerHTML=txnHTML(s,lang);
      const vbox=el.querySelector('.vulnbox');
      if(vbox){ vbox.innerHTML=vulnHTML(s,lang);
        vbox.querySelectorAll('svg text[data-en]').forEach(n=>{
          n.textContent=n.hasAttribute('data-'+lang)?n.getAttribute('data-'+lang):n.getAttribute('data-en');});}
      const kb=el.querySelector('.kbox');
      if(kb){ kb.innerHTML=KR[s.kind](s,lang);
        if(s.kind==='chart') drawChart(kb,s,lang);
        kb.querySelectorAll('button[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go))); }
      const cl=el.querySelector('[data-i=claim]'); if(cl) cl.innerHTML=rich(pick(s.claim,lang));
      const h=el.querySelector('[data-i=heading]'); if(h) h.textContent=pick(s.heading,lang);
      const tx=el.querySelector('[data-i=text]');
      if(tx) tx.innerHTML = rich(pick(s.text,lang));
      const pr=el.querySelector('[data-i=prose]');
      if(pr) pr.innerHTML = proseHTML(s.text,lang);
      const cp=el.querySelector('[data-i=caption]'); if(cp) cp.innerHTML=rich(pick(s.caption,lang));
      const hn=el.querySelector('[data-i=hint]');
      if(hn) hn.textContent = s.hint ? pick(s.hint,lang) : (T[lang].smapHint||'');
      el.querySelectorAll('[data-item]').forEach(sp=>{
        // `text` may carry <code> around names worth keeping verbatim; nothing
        // else is honoured, so a packet cannot smuggle markup into the page.
        sp.innerHTML = rich(pick((s.items||[])[+sp.dataset.item]?.text,lang));
      });
    });
    // One SVG carries all three languages, so switching cannot shift layout.
    document.querySelectorAll('svg text[data-en]').forEach(n=>{
      n.textContent = n.hasAttribute('data-'+lang)
        ? n.getAttribute('data-'+lang) : n.getAttribute('data-en');
    });

    const ol=document.getElementById('outline'); ol.innerHTML='';
    secs.forEach((s,i)=>{
      const li=document.createElement('li');
      const b=document.createElement('button'); b.type='button';
      const t2=document.createElement('span'); t2.className='ttl';
      t2.textContent=pick(s.heading,lang); b.appendChild(t2);
      b.setAttribute('aria-current',String(i===idx));
      b.addEventListener('click',()=>go(i));
      li.appendChild(b); ol.appendChild(li);
    });
    // The ticks are the only navigation on screen when the drawer is closed,
    // so they carry position and length without needing the titles.
    const rt=document.getElementById('railticks'); rt.innerHTML='';
    secs.forEach((s,i)=>{
      const b=document.createElement('button'); b.type='button';
      b.textContent=String(i+1).padStart(2,'0');
      b.title=pick(s.heading,lang);
      b.setAttribute('aria-current',String(i===idx));
      b.addEventListener('click',()=>go(i));
      rt.appendChild(b);
    });
    document.querySelectorAll('.langs button').forEach(b=>
      b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===secs.length-1;
    document.getElementById('foot').innerHTML =
      'baton · format '+E(D.format_version)+' · <span class="layer">'+E(D.layer)+'</span>'+
      (D.layer_note?' · '+E(String(pick(D.layer_note,lang)).replace(/`/g,'')):'');
  }

  let rsT=0; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{
    built.forEach((el,i)=>{ const s=secs[i]; if(s.kind==='chart'){ const kb=el.querySelector('.kbox'); if(kb) drawChart(kb,s,lang); } }); },150); });
  function go(n){
    if(n<0||n>=secs.length) return;
    built[idx].classList.remove('on');
    idx=n;
    built[idx].classList.add('on');
    animate(built[idx]);
    paint();
  }

  // The drawer opens on approach and closes on a short delay, so clipping a
  // corner on the way to a tick does not snap it shut mid-reach. CSS :hover
  // does the same thing on its own; this only makes the close forgiving.
  (function(){
    const rail=document.querySelector('.rail'); if(!rail) return;
    let t=null;
    const set=v=>{clearTimeout(t);
      if(v) rail.classList.add('open');
      else t=setTimeout(()=>rail.classList.remove('open'),260);};
    rail.addEventListener('pointerenter',()=>set(true));
    rail.addEventListener('pointerleave',()=>set(false));
    rail.addEventListener('focusin',()=>set(true));
    rail.addEventListener('focusout',()=>set(false));
  })();

  document.querySelectorAll('.langs button').forEach(b=>
    b.addEventListener('click',()=>{lang=b.dataset.lang;
      localStorage.setItem('baton-lang',lang); paint();}));
  document.getElementById('prev').addEventListener('click',()=>go(idx-1));
  document.getElementById('next').addEventListener('click',()=>go(idx+1));
  addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA') return;
    // Arrow keys on a sideways-scrolling table scroll the table, not the page.
    if(e.target.closest&&e.target.closest('.tscroll')) return;
    if(e.key==='ArrowRight'||e.key==='j') go(idx+1);
    if(e.key==='ArrowLeft'||e.key==='k') go(idx-1);
  });

  // The one action the page exists to enable, so it has to work everywhere the
  // page can be opened. A published page runs inside an iframe where the async
  // clipboard is often denied, and a button that silently does nothing strands
  // the reader with no way to reach the packet at all. Three rungs: the async
  // API, the legacy command, then a panel with the text already selected,
  // which needs no permission anywhere.
  const rawbox=document.getElementById('rawbox'), rawtext=document.getElementById('rawtext');
  function showRaw(){
    rawtext.value=CTX;
    if(typeof rawbox.showModal==='function') rawbox.showModal();
    else rawbox.setAttribute('open','');
    rawtext.focus(); rawtext.select();
  }
  const cp=document.getElementById('cp');
  cp.addEventListener('click',async()=>{
    let ok=false;
    try{ await navigator.clipboard.writeText(CTX); ok=true; }
    catch(e){
      try{
        const ta=document.createElement('textarea');
        ta.value=CTX; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        ok=document.execCommand('copy'); ta.remove();
      }catch(e2){ ok=false; }
    }
    if(!ok){ showRaw(); return; }
    cp.classList.add('done'); cp.textContent=T[lang].copied;
    setTimeout(()=>{cp.classList.remove('done'); cp.textContent=T[lang].cp;},2000);
  });
  document.getElementById('raw').addEventListener('click',showRaw);
  document.getElementById('dl').addEventListener('click',()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([CTX],{type:'text/markdown'}));
    a.download=D.filename+'.md'; a.click(); URL.revokeObjectURL(a.href);
  });
  // Same HTML the reader sees — expand steps, keep colours, open the system
  // print dialog (Save as PDF). Agents that need a file use scripts/export_pdf.py.
  document.getElementById('pdf').addEventListener('click',()=>{
    const restore=document.documentElement.getAttribute('data-theme');
    document.body.classList.add('baton-printing');
    document.documentElement.setAttribute('data-theme','light');
    const done=()=>{
      document.body.classList.remove('baton-printing');
      if(restore) document.documentElement.setAttribute('data-theme',restore);
      else document.documentElement.removeAttribute('data-theme');
      removeEventListener('afterprint', done);
    };
    addEventListener('afterprint', done);
    setTimeout(()=>window.print(), 50);
  });

  // ---- diagrams are inline SVG from the diagram-design skill: static markup,
  // no runtime library. Two things stay live — the labels follow the reader's
  // language, and the colours follow the theme through CSS variables, which
  // need no work here at all.
  function relabelDiagrams(){
    document.querySelectorAll('.figbody svg text[data-en]').forEach(n=>{
      n.textContent = n.hasAttribute('data-'+lang)
        ? n.getAttribute('data-'+lang) : n.getAttribute('data-en');
    });
    markInert();
    autoPickStatemaps();   // restore the selected state after a relabel
  }

  // Interactive state map: clicking a state shows the DB write behind it.
  // Show that state's DB transaction and light up its rollout stage.
  function selectState(secIdx, id){
    const s = secs[secIdx];
    if(!s || !s.detail) return;
    const step = built[secIdx];
    const detail = step.querySelector('.smap-detail');
    const txn = s.detail[id];
    if(detail){
      if(txn){ detail.innerHTML = txnHTML(txn, lang); }
      else { detail.innerHTML=''; detail.setAttribute('data-empty', T[lang].smapEmpty||'Pick a state to see its database write.'); }
    }
    const stage = (s.stages||{})[id];
    step.querySelectorAll('.smap-stage').forEach(d=>
      d.classList.toggle('on', !!stage && d.dataset.stage===stage));
    // Highlight by the contract attribute — the shape carries its own id.
    step.querySelectorAll('.figbody svg [data-node]').forEach(n=>{
      n.classList.toggle('picked', n.getAttribute('data-node')===id);
      n.style.strokeWidth = n.getAttribute('data-node')===id ? '3' : '';
    });
    step.dataset.picked=id;
  }

  // A shape with no transaction behind it should not look clickable, and a
  // stage no state belongs to is not a control. Mark both once the diagram is
  // in the DOM, so the page never invites a click it cannot answer.
  function markInert(){
    secs.forEach((s,i)=>{
      if(s.kind!=='statemap') return;
      const step=built[i], detail=s.detail||{}, stages=s.stages||{};
      step.querySelectorAll('.figbody svg [data-node]').forEach(n=>
        n.classList.toggle('inert', !detail[n.getAttribute('data-node')]));
      const live=new Set(Object.keys(detail).map(k=>stages[k]).filter(Boolean));
      step.querySelectorAll('.smap-stage').forEach(d=>{
        const empty=!live.has(d.dataset.stage);
        d.classList.toggle('empty', empty);
        d.disabled=empty;
      });
    });
  }
  // The diagram is static SVG with no script of its own, so the page owns the
  // interaction: delegate a click, read the id off the shape. This is why the
  // statemap still works inlined in a sandboxed iframe.
  document.addEventListener('click', e=>{
    const step = e.target.closest && e.target.closest('.step.smap');
    if(!step) return;
    const panel = step.querySelector('.smap-detail');
    if(!panel) return;
    const sec = +panel.dataset.sec, s = secs[sec];

    const hit = e.target.closest('[data-node]');
    if(hit && (s.detail||{})[hit.getAttribute('data-node')]){
      selectState(sec, hit.getAttribute('data-node')); return;
    }
    // The stage strip is a second way in: pick the state that lives there.
    const chip = e.target.closest('.smap-stage');
    if(chip && !chip.disabled){
      const id = Object.keys(s.detail||{})
        .find(k => (s.stages||{})[k] === chip.dataset.stage);
      if(id) selectState(sec, id);
    }
  });
  function autoPickStatemaps(){
    secs.forEach((s,i)=>{ if(s.kind==='statemap' && s.detail){
      const cur=built[i].dataset.picked;
      const first=cur||Object.keys(s.detail)[0];
      if(first) selectState(i, first);
    }});
  }

  // Re-render on language and on theme change (the theme toggle stamps data-theme).
  const _paint = paint;
  paint = function(){ _paint(); relabelDiagrams(); };

  built[0].classList.add('on'); animate(built[0]); paint();
})();
</script>
</body>
</html>
