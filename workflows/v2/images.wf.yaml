{
  "id": "images",
  "name": "Images",
  "kind": "image",
  "version": 1,
  "description": "One PNG image made with Codex from your description, checked, then accepted by you and saved to the Library.",
  "intent": {
    "keywords": [
      "image",
      "picture",
      "圖片",
      "氣球"
    ]
  },
  "roles": [
    {
      "id": "image-worker",
      "label": "Image maker",
      "seat": "image-maker",
      "skill": "bundled:workflows/skills/v2/image.md"
    }
  ],
  "seats": [
    {
      "id": "image-maker",
      "label": "Image maker",
      "labelZh": "圖像產出",
      "needs": [
        "image-generation"
      ],
      "suggest": {
        "provider": "codex"
      }
    }
  ],
  "nodes": [
    {
      "id": "intake",
      "kind": "hook",
      "label": "Capture intent",
      "do": "deliver.intake",
      "x": 100,
      "y": 140
    },
    {
      "id": "draft",
      "kind": "hook",
      "label": "Generate PNG with Codex",
      "do": "image.generate",
      "skills": [
        {
          "id": "image-prompting",
          "v": 1,
          "sha256": "7bb1522478f41c18c98d8e7c8af60a58077d8774bb417012673036d8dd2f0436"
        }
      ],
      "role": "image-worker",
      "timeout_s": 240,
      "x": 300,
      "y": 140
    },
    {
      "id": "checks",
      "kind": "check",
      "label": "PNG readiness",
      "checks": [
        {
          "use": "core/artifact-ready",
          "proves": [
            0
          ]
        }
      ],
      "args": {
        "producer": "all"
      },
      "x": 500,
      "y": 140
    },
    {
      "id": "accept",
      "kind": "card",
      "label": "Final acceptance",
      "args": {
        "mode": "deliver-accept"
      },
      "x": 700,
      "y": 140
    },
    {
      "id": "library",
      "kind": "hook",
      "label": "Publish approved image",
      "do": "library.publish",
      "x": 900,
      "y": 140
    },
    {
      "id": "done",
      "kind": "hook",
      "label": "Approved",
      "x": 1100,
      "y": 140
    },
    {
      "id": "closed",
      "kind": "hook",
      "label": "Closed",
      "args": {
        "result": "closed"
      },
      "x": 900,
      "y": 340
    }
  ],
  "edges": [
    [
      "intake",
      "draft"
    ],
    [
      "draft",
      "checks"
    ],
    [
      "checks",
      "accept",
      "pass"
    ],
    [
      "accept",
      "draft",
      "changes"
    ],
    [
      "accept",
      "closed",
      "rejected"
    ],
    [
      "accept",
      "library",
      "approved"
    ],
    [
      "library",
      "done"
    ]
  ]
}
