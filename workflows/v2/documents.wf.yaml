{
  "id": "documents",
  "name": "Documents",
  "kind": "doc",
  "version": 1,
  "description": "A written document: a writer drafts it, readiness checks and revision rounds follow, you accept it, and it is saved to the Library and exported.",
  "intent": {
    "keywords": [
      "documents",
      "document"
    ]
  },
  "roles": [
    {
      "id": "writer",
      "label": "Writer",
      "seat": "maker",
      "skill": "bundled:workflows/skills/v2/writer.md"
    }
  ],
  "nodes": [
    {
      "id": "intake",
      "kind": "hook",
      "label": "Capture intent",
      "do": "deliver.intake",
      "x": 160,
      "y": 140
    },
    {
      "id": "produce",
      "kind": "hook",
      "label": "Begin artifact round",
      "do": "deliver.round",
      "x": 300,
      "y": 140
    },
    {
      "id": "draft",
      "kind": "agent",
      "label": "Produce draft",
      "role": "writer",
      "mode": "deliver",
      "args": {
        "format": "document",
        "variant": "A"
      },
      "retries": 1,
      "timeout_s": 900,
      "x": 460,
      "y": 140
    },
    {
      "id": "checks",
      "kind": "check",
      "label": "Artifact readiness",
      "join": "all",
      "checks": [
        {
          "use": "core/artifact-ready",
          "proves": [
            0
          ]
        }
      ],
      "args": {
        "producer": "all"
      },
      "x": 800,
      "y": 140
    },
    {
      "id": "refine",
      "kind": "loop",
      "label": "Refine artifact",
      "args": {
        "producer": "draft",
        "round_cap": 5,
        "route_classes": {
          "renderer-unavailable": "unavailable"
        }
      },
      "x": 960,
      "y": 140
    },
    {
      "id": "accept",
      "kind": "card",
      "label": "Final acceptance",
      "args": {
        "mode": "deliver-accept"
      },
      "x": 1120,
      "y": 140
    },
    {
      "id": "capability",
      "kind": "card",
      "label": "Renderer missing",
      "x": 1120,
      "y": 440,
      "args": {
        "body_from": "render-capability",
        "card_kind": "question"
      }
    },
    {
      "id": "escalation",
      "kind": "card",
      "label": "Checks did not pass",
      "x": 1120,
      "y": 600,
      "args": {
        "body_from": "deliver-escalation",
        "card_kind": "step-back",
        "firstmate_first": true
      },
      "card": {
        "effects": {
          "retry": {
            "policy": "round_cap",
            "add": 1
          },
          "changes": {
            "policy": "round_cap",
            "add": 1
          }
        }
      }
    },
    {
      "id": "library",
      "kind": "hook",
      "label": "Publish approved artifact",
      "do": "library.publish",
      "x": 1440,
      "y": 140
    },
    {
      "id": "done",
      "kind": "hook",
      "label": "Approved",
      "x": 1600,
      "y": 140
    },
    {
      "id": "closed",
      "kind": "hook",
      "label": "Closed",
      "args": {
        "result": "closed"
      },
      "x": 1440,
      "y": 440
    },
    {
      "id": "export",
      "kind": "hook",
      "label": "Export approved document",
      "do": "doc.export",
      "x": 1280,
      "y": 140
    }
  ],
  "edges": [
    [
      "intake",
      "produce"
    ],
    [
      "produce",
      "draft"
    ],
    [
      "draft",
      "checks"
    ],
    [
      "checks",
      "refine",
      "pass|fail"
    ],
    [
      "refine",
      "accept",
      "pass"
    ],
    [
      "refine",
      "produce",
      "retry"
    ],
    [
      "refine",
      "capability",
      "unavailable"
    ],
    [
      "refine",
      "escalation",
      "cap|stalled|step-back"
    ],
    [
      "capability",
      "produce",
      "retry"
    ],
    [
      "capability",
      "closed",
      "close"
    ],
    [
      "escalation",
      "refine",
      "retry|changes"
    ],
    [
      "escalation",
      "closed",
      "close"
    ],
    [
      "accept",
      "produce",
      "changes"
    ],
    [
      "accept",
      "closed",
      "rejected"
    ],
    [
      "accept",
      "export",
      "approved"
    ],
    [
      "export",
      "library"
    ],
    [
      "library",
      "done"
    ]
  ]
}
