{
  "id": "github-review",
  "name": "GitHub coding and external review (draft)",
  "kind": "code",
  "version": 1,
  "description": "Editable coding pipeline draft with external reviewer identity confirmation; no automatic merge. Runtime activation is pending.",
  "intent": {
    "keywords": [
      "github review workflow"
    ]
  },
  "params": {
    "repo": {
      "label": "Repository path (blank = the demo repo)",
      "default": ""
    },
    "project": {
      "label": "Project id (optional)",
      "default": ""
    },
    "base": {
      "label": "Base branch",
      "default": "main"
    }
  },
  "roles": [
    {
      "id": "coordinator",
      "label": "Coordinator (firstmate)",
      "skill": "pack:firstmate/skills/firstmate.md"
    },
    {
      "id": "worker",
      "label": "Worker",
      "skill": "pack:firstmate/skills/worker.md"
    },
    {
      "id": "reviewer",
      "label": "Reviewer",
      "skill": "pack:firstmate/skills/reviewer.md"
    },
    {
      "id": "designer",
      "label": "Designer reviewer",
      "skill": "pack:firstmate/skills/designer.md"
    }
  ],
  "nodes": [
    {
      "id": "intake",
      "kind": "hook",
      "label": "Capture intent",
      "do": "intent.capture",
      "x": 170,
      "y": 220
    },
    {
      "id": "prepare",
      "kind": "hook",
      "label": "Worktree",
      "detail": "branch on base",
      "do": "repo.prepare",
      "x": 340,
      "y": 220
    },
    {
      "id": "spec",
      "kind": "agent",
      "label": "Spec",
      "detail": "what · why · done · scope · door",
      "role": "coordinator",
      "mode": "spec",
      "retries": 1,
      "timeout_s": 900,
      "skills": [
        {
          "id": "plain-writing",
          "v": 1,
          "sha256": "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467"
        }
      ],
      "checks": [
        {
          "use": "firstmate/spec-schema"
        },
        {
          "use": "firstmate/done-lines-provable"
        },
        {
          "use": "firstmate/caller-coverage"
        },
        {
          "use": "firstmate/overlap"
        },
        {
          "use": "core/ste-wording"
        },
        {
          "use": "firstmate/no-impl-detail"
        },
        {
          "use": "firstmate/done-lines-observable"
        }
      ],
      "x": 510,
      "y": 220
    },
    {
      "id": "spec-fix",
      "kind": "loop",
      "label": "Refine spec",
      "detail": "brief from the findings",
      "args": {
        "producer": "spec",
        "coordinator": "coordinator",
        "route_classes": {
          "door-change": "door-change"
        }
      },
      "x": 510,
      "y": 40
    },
    {
      "id": "dispatch",
      "kind": "card",
      "label": "Dispatch card",
      "args": {
        "body_from": "dispatch",
        "card_kind": "dispatch"
      },
      "x": 680,
      "y": 220
    },
    {
      "id": "door",
      "kind": "check",
      "label": "Door",
      "detail": "scope ∩ sensitive paths",
      "checks": [
        {
          "use": "firstmate/door-classify"
        }
      ],
      "args": {
        "route_from": "firstmate/door-classify",
        "store": "door"
      },
      "x": 850,
      "y": 220
    },
    {
      "id": "door-pick",
      "kind": "card",
      "label": "Pick the door",
      "args": {
        "body_from": "door",
        "card_kind": "question"
      },
      "x": 850,
      "y": 40
    },
    {
      "id": "plan",
      "kind": "agent",
      "label": "Plan round",
      "detail": "one-way: no file changes",
      "role": "worker",
      "mode": "plan",
      "lane": "one-way",
      "retries": 1,
      "timeout_s": 900,
      "checks": [
        {
          "use": "firstmate/plan-covers-done-lines"
        },
        {
          "use": "firstmate/questions-listed"
        }
      ],
      "x": 1020,
      "y": 400
    },
    {
      "id": "plan-fix",
      "kind": "loop",
      "label": "Refine plan",
      "args": {
        "producer": "plan"
      },
      "lane": "one-way",
      "x": 1020,
      "y": 580
    },
    {
      "id": "plan-accept",
      "kind": "agent",
      "label": "Accept plan",
      "detail": "signed: round + head",
      "role": "coordinator",
      "mode": "plan-accept",
      "lane": "one-way",
      "retries": 1,
      "timeout_s": 600,
      "skills": [
        {
          "id": "plain-writing",
          "v": 1,
          "sha256": "4eca3a4b795e005bd31f614a0eace04a2bc81a740132374b2dabcd4ee3d11467"
        }
      ],
      "x": 1190,
      "y": 400
    },
    {
      "id": "build",
      "kind": "agent",
      "label": "Build round",
      "detail": "brief bound to round + head",
      "lifecycle": [
        "after_round"
      ],
      "role": "worker",
      "mode": "build",
      "retries": 1,
      "checks": [
        {
          "use": "firstmate/scope"
        },
        {
          "use": "firstmate/lints"
        },
        {
          "use": "firstmate/file-size-cap"
        },
        {
          "use": "firstmate/covering-suites"
        },
        {
          "use": "firstmate/fixture-modules"
        },
        {
          "use": "firstmate/report-schema"
        }
      ],
      "x": 1360,
      "y": 220
    },
    {
      "id": "pr-open",
      "kind": "hook",
      "do": "pr.open",
      "label": "Review request",
      "x": 1530,
      "y": 220
    },
    {
      "id": "ci",
      "kind": "check",
      "label": "CI",
      "detail": "sharded · fail-first · shard budget",
      "checks": [
        {
          "use": "firstmate/ci"
        },
        {
          "use": "firstmate/fail-first"
        },
        {
          "use": "firstmate/shard-budget"
        },
        {
          "use": "firstmate/ui-captures"
        }
      ],
      "x": 1700,
      "y": 220
    },
    {
      "id": "review",
      "kind": "agent",
      "label": "Fresh reviewer",
      "detail": "runs the tests, reads every changed file",
      "role": "reviewer",
      "mode": "review",
      "retries": 1,
      "timeout_s": 900,
      "checks": [
        {
          "use": "firstmate/review-depth"
        },
        {
          "use": "firstmate/review-verdict"
        },
        {
          "use": "firstmate/designer-compare"
        }
      ],
      "x": 1870,
      "y": 220
    },
    {
      "id": "fix",
      "kind": "loop",
      "label": "Fix (refine loop)",
      "detail": "brief · step-back · budget",
      "args": {
        "producer": "build",
        "coordinator": "coordinator",
        "route_classes": {
          "door-change": "door-change",
          "review-unverified": "step-back"
        },
        "answer_routes": {
          "step-back:other-model": "pass"
        },
        "report_checks": [
          "firstmate/report-schema"
        ]
      },
      "x": 1700,
      "y": 460
    },
    {
      "id": "step-back",
      "kind": "card",
      "label": "Step-back card",
      "detail": "same class twice · reviewer unverified",
      "args": {
        "body_from": "step-back",
        "card_kind": "step-back"
      },
      "x": 1870,
      "y": 640
    },
    {
      "id": "stalled",
      "kind": "card",
      "label": "No-progress card",
      "args": {
        "body_from": "stalled",
        "card_kind": "step-back"
      },
      "x": 1700,
      "y": 640
    },
    {
      "id": "budget",
      "kind": "card",
      "label": "Round-budget card",
      "args": {
        "body_from": "budget",
        "card_kind": "round-budget"
      },
      "card": {
        "effects": {
          "extend": {
            "policy": "round_cap",
            "add": 2
          }
        }
      },
      "x": 1360,
      "y": 640
    },
    {
      "id": "scope-card",
      "kind": "card",
      "label": "Scope card",
      "args": {
        "body_from": "scope",
        "card_kind": "scope"
      },
      "x": 1190,
      "y": 40
    },
    {
      "id": "parked",
      "kind": "hook",
      "label": "Parked",
      "args": {
        "result": "closed",
        "summary": "parked by the captain"
      },
      "x": 2070,
      "y": 640
    },
    {
      "id": "closed",
      "kind": "hook",
      "label": "Closed",
      "args": {
        "result": "closed",
        "summary": "closed without merging"
      },
      "x": 2240,
      "y": 400
    },
    {
      "id": "dropped",
      "kind": "hook",
      "label": "Dropped",
      "args": {
        "result": "closed",
        "summary": "dropped at dispatch"
      },
      "x": 680,
      "y": 400
    },
    {
      "id": "external-review",
      "kind": "hook",
      "label": "Wait for exact-head external reviewers",
      "do": "github.review.wait",
      "x": 2240,
      "y": 220
    },
    {
      "id": "captain-ready",
      "kind": "card",
      "label": "Captain ready — no automatic merge",
      "x": 2500,
      "y": 220,
      "card": {
        "options": [
          {
            "id": "close",
            "label": "Close without merge"
          }
        ]
      }
    },
    {
      "id": "ready-done",
      "kind": "hook",
      "label": "Ready for captain",
      "x": 2750,
      "y": 220
    },
    {
      "id": "review-ready",
      "kind": "hook",
      "label": "Verify current reviews and CI again",
      "do": "github.review.ready",
      "x": 2400,
      "y": 220
    }
  ],
