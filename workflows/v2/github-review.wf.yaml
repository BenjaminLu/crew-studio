    {
      "id": "shepherd",
      "kind": "hook",
      "do": "pr.shepherd",
      "label": "PR follow-through",
      "detail": "Reads the pull request on every refresh of the Pull requests list and picks the branch. State, evidence and CI by rules; a reviewer's comment by its quoted sentence; unclear → a card asks you.",
      "x": 2240,
      "y": 220,
      "explain": [
        {
          "h": {
            "en": "Reads",
            "zh-TW": "讀什麼"
          },
          "v": {
            "en": "The same as the Pull requests page: required reviewers, evidence sources, environments, and the base branch's rules (rulesets and branch protection: approval count, required teams, code owners, approval after the last push, stale approvals dismissed).",
            "zh-TW": "和 Pull requests 頁同一套：必須的 reviewer、證據來源、環境，以及 base branch 的規則（rulesets / branch protection：approve 數、必須的 team、code owners、最後一次 push 之後的 approve、push 是否讓舊 approve 失效）"
          }
        },
        {
          "h": {
            "en": "Mergeable is not built in",
            "zh-TW": "合併條件不寫死"
          },
          "v": {
            "en": "Mergeable = this repository's own branch rules all met + the required reviewers + evidence (when a source is set) + CI. Rules that cannot be read stop and ask; never treated as met.",
            "zh-TW": "「可合併」= 這個 repo 自己的分支規則全部滿足 + 設定的必須 reviewer + 證據（有設定時）+ CI。規則讀不到就停住問你，不當作滿足。"
          }
        },
        {
          "h": {
            "en": "Before a push",
            "zh-TW": "push 前提醒"
          },
          "v": {
            "en": "When the rules void approvals on a push and there are some, a card asks first: \"this push voids N approvals\"; it pushes only on your yes.",
            "zh-TW": "規則會讓舊 approve 失效、而且已有 approve 時，先出卡：「這次 push 會讓 N 個 approve 失效」，你確認才推。"
          }
        },
        {
          "h": {
            "en": "Classifying a comment",
            "zh-TW": "留言分類"
          },
          "v": {
            "en": "Code change / needs evidence / a question / not blocking, always quoting the sentence; no quote → a card asks you.",
            "zh-TW": "要改代碼 / 要外部證據 / 只是提問 / 不擋合併，一定引用原句；引不出來就出卡問你。"
          }
        },
        {
          "h": {
            "en": "Never",
            "zh-TW": "不會做"
          },
          "v": {
            "en": "@-mention anyone on GitHub, press re-request review, or send a message without your click.",
            "zh-TW": "不會自己在 GitHub @ 人、不會按 re-request review、不會沒經過你按就送出訊息。"
          }
        },
        {
          "h": {
            "en": "Not running yet",
            "zh-TW": "還不會執行"
          },
          "v": {
            "en": "This workflow is held (draft only) until its runtime is rebuilt from code-firstmate, so this node does not run yet. Today the same follow-through runs for the pull requests on the Pull requests page: its cards come from there (workflow pr-follow).",
            "zh-TW": "這個流程目前暫停（只能存草稿），要等它的執行改由 code-firstmate 重建，所以這個節點還不會執行。現在同樣的 PR 跟進由 Pull requests 頁對追蹤中的 PR 執行，卡片從那裡來（流程 pr-follow）。"
          }
        }
      ],
      "new": true,
      "preview": "inbox"
    },
