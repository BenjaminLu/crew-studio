{
  "id": "web-prototype",
  "name": "Web Prototype",
  "kind": "web",
  "version": 1,
  "description": "Two web page designs side by side from one brief, checked and revised, then you accept one into the Library.",
  "intent": {
    "keywords": [
      "web-prototype",
      "web"
    ]
  },
  "roles": [
    {
      "id": "designer",
      "label": "Designer",
      "skill": "bundled:workflows/skills/v2/designer.md"
    }
  ],
  "nodes": [
    {
      "id": "intake",
      "kind": "hook",
      "label": "Capture intent",
      "do": "deliver.intake",
      "x": 160,
      "y": 140
    },
    {
      "id": "produce",
      "kind": "hook",
      "label": "Begin artifact round",
      "do": "deliver.round",
      "x": 300,
      "y": 140
    },
    {
      "id": "design-a",
      "kind": "agent",
      "label": "Produce design-a",
      "role": "designer",
      "mode": "deliver",
      "args": {
        "format": "web",
        "variant": "A"
      },
      "retries": 1,
      "timeout_s": 900,
      "x": 460,
      "y": 140
    },
    {
      "id": "design-b",
      "kind": "agent",
      "label": "Produce design-b",
      "role": "designer",
      "mode": "deliver",
      "args": {
        "format": "web",
        "variant": "B"
      },
      "retries": 1,
      "timeout_s": 900,
      "x": 460,
      "y": 280
    },
    {
      "id": "checks",
      "kind": "check",
      "label": "Artifact readiness",
      "join": "all",
      "checks": [
        {
          "use": "core/artifact-ready",
          "proves": [
            0
          ]
        }
      ],
      "args": {
        "producer": "all"
      },
      "x": 800,
      "y": 140
    },
    {
      "id": "refine",
      "kind": "loop",
      "label": "Refine artifact",
      "args": {
        "producer": "design-a",
        "round_cap": 5,
        "route_classes": {
          "renderer-unavailable": "unavailable"
        }
      },
      "x": 960,
      "y": 140
    },
    {
      "id": "accept",
      "kind": "card",
      "label": "Final acceptance",
      "args": {
        "mode": "deliver-accept"
      },
      "x": 1120,
      "y": 140
    },
    {
      "id": "capability",
      "kind": "card",
      "label": "Render unavailable",
      "card": {
        "title": {
          "en": "MP4 not verified",
          "zh-TW": "MP4 尚未驗證"
        },
        "body": {
          "en": "Install the optional local renderer in Doctor, then start a new video task. HTML source remains available; no MP4 approval is recorded.",
          "zh-TW": "可在 Doctor 安裝本機轉檔工具後再開始影片任務。HTML 原始檔仍在；目前未核准 MP4。"
        },
        "options": [
          {
            "id": "close",
            "label": "Close",
            "labelZh": "關閉"
          }
        ]
      },
      "x": 1120,
      "y": 440
    },
    {
      "id": "escalation",
      "kind": "card",
      "label": "Artifact needs attention",
      "card": {
        "title": {
          "en": "Artifact needs attention",
          "zh-TW": "產物需要處理"
        },
        "body": {
          "en": "Checks did not converge. Close this task and adjust its intent before trying again.",
          "zh-TW": "檢查仍未通過。請關閉此任務，調整任務意圖後再試一次。"
        },
        "options": [
          {
            "id": "close",
            "label": "Close",
            "labelZh": "關閉"
          }
        ]
      },
      "x": 1120,
      "y": 600
    },
    {
      "id": "library",
      "kind": "hook",
      "label": "Publish approved artifact",
      "do": "library.publish",
      "x": 1440,
      "y": 140
    },
    {
      "id": "done",
      "kind": "hook",
      "label": "Approved",
      "x": 1600,
      "y": 140
    },
    {
      "id": "closed",
      "kind": "hook",
      "label": "Closed",
      "args": {
        "result": "closed"
      },
      "x": 1440,
      "y": 440
    }
  ],
  "edges": [
    [
      "intake",
      "produce"
    ],
    [
      "produce",
      "design-a"
    ],
    [
      "produce",
      "design-b"
    ],
    [
      "design-a",
      "checks"
    ],
    [
      "design-b",
      "checks"
    ],
    [
      "checks",
      "refine",
      "pass|fail"
    ],
    [
      "refine",
      "accept",
      "pass"
    ],
    [
      "refine",
      "produce",
      "retry"
    ],
    [
      "refine",
      "capability",
      "unavailable"
    ],
    [
      "refine",
      "escalation",
      "cap|stalled|step-back"
    ],
    [
      "capability",
      "closed",
      "close"
    ],
    [
      "escalation",
      "closed",
      "close"
    ],
    [
      "accept",
      "produce",
      "changes"
    ],
    [
      "accept",
      "closed",
      "rejected"
    ],
    [
      "accept",
      "library",
      "approved"
    ],
    [
      "library",
      "done"
    ]
  ]
}
