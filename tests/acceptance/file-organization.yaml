# Live acceptance: File organization. Studio plans moves inside one folder and gates them; the
# acceptance card would move real files, so the run is accepted when it reaches that card with a plan.
# The captain names a throwaway folder: --params '{"folder": "<path>"}' in a JSON file.
schema: 2
workflow: file-organization
pin: { version: 1, sha256: "5af1a063a15180c04e35aaa0806d4902fba46432fe10a31b95733f262b4abc7e" }   # bun scripts/acceptance/pin.ts file-organization
topic: "Sort the files in the acceptance folder by type."
start: { provider: null, params: {}, required_params: [folder] }
providers: []
approvals: { staffing: false }
cards: []
expect:
  stop_at: card
  artifacts: []
budget: { wall_minutes: 10, max_rounds: 4 }
stub:
  - name: board
    covers: "the board's Start form supplies the declared folder → plan → gates → captain applies the moves"
    setup: [folder]
    params: { folder: "{folder}" }
    proves: [files-applied]
    cards: [{ node: card, answer: apply, before: fileorg-unmoved }]
    expect: { status: succeeded, result: done, visited: [intake, plan, gates, card, apply, done] }
  - name: sample-folder
    covers: "a first run with the folder left blank: Studio makes a sample folder in its own data → plan → gates → captain applies the moves there"
    cards: [{ node: card, answer: apply }]
    expect: { status: succeeded, result: done, visited: [intake, plan, gates, card, apply, done] }
  - name: firstmate-apply
    covers: "Firstmate proposes with the folder → captain approves dispatch → dry-run plan → gates → captain applies"
    how: firstmate
    setup: [folder]
    params: { folder: "{folder}" }
    cards: [{ node: card, answer: apply }]
    expect: { status: succeeded, result: done, visited: [intake, plan, gates, card, apply, done], not_visited: [discard] }
  - name: firstmate-discard
    covers: "the same plan, captain discards it: nothing moves"
    how: firstmate
    setup: [folder]
    params: { folder: "{folder}" }
    proves: [files-discarded]
    cards: [{ node: card, answer: discard, before: fileorg-unmoved }]
    expect: { status: succeeded, visited: [plan, card, discard, discarded], not_visited: [apply] }
