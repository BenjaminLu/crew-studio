# Live acceptance: Coffee kit. Starting it needs the captain's discussed design plan and an approved
# coffee staffing, so it starts only with --params carrying project and coffeeDesignPlan. The
# direction card confirms paid generation: the run is accepted when it reaches that card.
schema: 2
workflow: coffee-kit
pin: { version: 1, sha256: "9bc2157207c66507b0d0cbd62f0f09a710573e01994a7920ef11fd6c030b9f8c" }   # bun scripts/acceptance/pin.ts coffee-kit
topic: "A small coffee shop's opening week kit."
start: { provider: null, params: {}, required_params: [project, coffeeDesignPlan] }
providers: [codex]
approvals: { staffing: false }
cards: []
expect:
  stop_at: direction
  artifacts: []
budget: { wall_minutes: 10, max_rounds: 4 }
stub:
  - name: board
    covers: "the coffee form after staffing and a validated design plan → direction card"
    setup: [coffee]
    params: { project: "{project}", coffeeDesignPlan: "{coffeeDesignPlan}" }
    expect: { waiting_on: direction, visited: [direction] }
  - name: confirm-film-unavailable
    covers: "the coffee form → captain confirms the direction → page round (sandboxed worker) → image (Codex image stub) → no HyperFrames toolchain offline, so the film goes to the capability card → captain closes"
    setup: [coffee]
    params: { project: "{project}", coffeeDesignPlan: "{coffeeDesignPlan}" }
    timeout_s: 180
    cards: [{ node: direction, answer: confirm }, { node: capability, answer: close }]
    expect: { status: succeeded, visited: [direction, round, page, image, video, capability, closed], not_visited: [library] }
