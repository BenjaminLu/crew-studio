# Live acceptance: Documents. A writer agent drafts doc.md, checks and the refine loop run,
# the captain's acceptance card approves, the document is exported to Studio's own library.
schema: 2
workflow: documents
pin: { version: 1, sha256: "688585e39d1aa2f22e5ed6e60f1d7bb1a4cde24188a8de81a3d5a78221b06e6d" }   # bun scripts/acceptance/pin.ts documents
topic: "Write a one-page memo that explains what Crew Studio's live acceptance run checks, for a new teammate."
start: { provider: null, params: {} }   # the board's Start form with "Default provider"
providers: []                           # the default provider is added when the workflow has agent nodes
approvals: { staffing: false }
cards:
  - { node: accept, kind: acceptance, answer: approve-draft, note: "live acceptance: approved to finish the run; quality is judged from the report" }
  - { node: capability, action: stop }  # the renderer is unavailable: report it, do not close the Task
  - { node: escalation, action: stop }  # checks did not converge: report it
expect:
  status: succeeded
  result: done
  artifacts: [{ deliver: 1 }]
budget: { wall_minutes: 30, max_rounds: 14 }
stub:
  - name: approve
    covers: "codex writer round in the OS sandbox → checks → captain approves → export (the PDF printed by headless Chromium) → Library; the round's sandbox probe"
    provider: codex
    setup: [probe]
    topic: "Write a one-page memo that explains what Crew Studio's live acceptance run checks, for a new teammate.\n{probe}"
    proves: [pdf-chromium, sandbox-probe]
    expect: { status: succeeded, result: done, visited: [intake, produce, draft, checks, refine, accept, export, library, done], not_visited: [closed], library: true, outputs: 1 }
  - name: changes-then-approve
    covers: "captain asks for changes with a note → a second draft round → approve"
    provider: codex
    cards: [{ node: accept, answers: [changes, approve-draft], note: "Make the title shorter." }]
    expect: { status: succeeded, visited: [draft, accept, export, library, done], library: true, min_visits: { draft: 2, accept: 2 } }
  - name: claude
    covers: "the same Task on the board's Claude provider: claude stream-json through the verified native receipt; the Claude round's sandbox probe"
    provider: claude
    setup: [verify-claude, probe-claude]
    topic: "Write a one-page memo that explains what Crew Studio's live acceptance run checks, for a new teammate.\n{probe}"
    proves: [pdf-chromium, sandbox-probe]
    expect: { status: succeeded, visited: [draft, checks, accept, export, library, done], library: true }
  - name: local-unrestricted
    covers: "the same Task with Studio in local-unrestricted mode (no OS sandbox, no egress proxy)"
    server: local-unrestricted
    profiles: [default, sandboxed]   # the e2e gate is sandbox-only: nothing to prove here there
    provider: codex
    expect: { status: succeeded, visited: [draft, checks, accept, export, library, done], library: true }
