# Live acceptance: Web prototype. Two designer agents draft variants A and B, checks and refine run,
# the captain's acceptance card approves one, it goes to Studio's own library.
schema: 2
workflow: web-prototype
pin: { version: 1, sha256: "d1258ae72600a73a3f1ee436e4b7d7c62fa920314dad2119aebdcb2cd3ccbba6" }   # bun scripts/acceptance/pin.ts web-prototype
topic: "A single-page status board that lists three tasks with their state and a last-updated time."
start: { provider: null, params: {} }
providers: []
approvals: { staffing: false }
cards:
  - { node: accept, kind: acceptance, answer: approve-design-a, note: "live acceptance: approved to finish the run; quality is judged from the report" }
  - { node: capability, action: stop }
  - { node: escalation, action: stop }
expect:
  status: succeeded
  result: done
  artifacts: [{ deliver: 1 }]
budget: { wall_minutes: 40, max_rounds: 18 }
stub:
  - name: approve-a
    covers: "two designer rounds → checks → captain approves direction A → Library"
    provider: codex
    expect: { status: succeeded, visited: [intake, produce, design-a, design-b, checks, refine, accept, library, done], library: true, outputs: 2 }
  - name: reject
    covers: "captain rejects both directions → closed, nothing in the Library"
    provider: codex
    cards: [{ node: accept, answer: reject }]
    expect: { status: succeeded, result: closed, visited: [design-a, design-b, accept, closed], not_visited: [library] }
