# Live acceptance: Startup competition. Claude founder and Codex judge (both Cursor on Cursor acceptance), up to three rounds each.
# Both cards are captain-only; CAPTAIN_ONLY_ALLOW in scripts/acceptance/scenarios.ts lists them at this pin.
schema: 2
workflow: startup-recursion
pin: { version: 1, sha256: "bcd48b6f8d8cbf9c59fd18d6729556d67ba4856a5b59db2a597afa739fa811b6" }   # bun scripts/acceptance/pin.ts startup-recursion
topic: "A service that turns a team's meeting notes into a weekly risk list."
start: { provider: null, params: {} }
providers: [claude, codex]
approvals: { staffing: false }
cards:
  - { node: choose, kind: question, answer: template, note: "live acceptance: run the bundled template" }
  - { node: accept, kind: acceptance, answer: accept, note: "live acceptance: accepted to finish the run; quality is judged from the report" }
expect:
  status: succeeded
  result: done
  # the signed competition text the accept node writes into the run folder (startup-output-fix, 269c9c0)
  artifacts: [{ file: startup-output/competition.md }]
budget: { wall_minutes: 40, max_rounds: 10 }
stub:
  - name: template-accept
    covers: "board start with Default provider → captain picks the template → Claude founder (verified receipt) → Codex judge says ready → captain accepts the transcript"
    expect: { status: succeeded, result: done, visited: [choose, pitch1, judge1, accept, done], not_visited: [pitch2], approved: "startup-{task}" }
  - name: revise
    covers: "the judge asks for a revision (ACCEPT_REVISE) → a second founder and judge round → accept"
    topic: "A service that turns a team's meeting notes into a weekly risk list. ACCEPT_REVISE"
    expect: { status: succeeded, visited: [pitch1, judge1, pitch2, judge2, accept, done], approved: "startup-{task}" }
  - name: close
    covers: "captain closes the choice card: no paid round runs"
    cards: [{ node: choose, answer: close }]
    expect: { status: succeeded, result: closed, visited: [choose, closed], not_visited: [pitch1] }
