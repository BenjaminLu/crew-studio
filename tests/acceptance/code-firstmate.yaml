# Live acceptance: Code (firstmate). The coordinator writes the spec; the dispatch card is the last
# point before work that opens a pull request, so the run stops there. The driver never answers dispatch cards.
schema: 2
workflow: code-firstmate
pin: { version: 1, sha256: "37979df4e7f14c9ef33e20124ce9dd1b7328d3e53f5bed73b223c93002f48977" }   # bun scripts/acceptance/pin.ts code-firstmate
topic: "Add one sentence to the README that says how to run the offline tests."
start: { provider: null, params: {}, required_params: [project] }
providers: []
approvals: { staffing: false }
cards: []
expect:
  stop_at: dispatch
  artifacts: []
budget: { wall_minutes: 30, max_rounds: 8 }
stub:
  - name: board
    covers: "board start on the sandbox project after the captain approved its staffing → spec round → dispatch card"
    setup: [staffing-code]
    params: { project: sandbox }
    # the stub names this test file in its done line: the sandbox counts test/** as tests (env-preflight)
    topic: "Add one sentence to the README that says how to run the offline tests.\nSTUB_FILE test/readme.test.ts :: import { test } from 'bun:test';\\n"
    expect: { waiting_on: dispatch, visited: [intake, prepare, spec] }
  - name: firstmate-merge
    covers: "Firstmate proposes on the sandbox project → dispatch → spec → build (worker writes the change and its test; bun test fails on the base, passes on the head) → CI → review → designer captures → local merge; every round's sandbox probe"
    how: firstmate
    setup: [staffing-code, probe]
    params: { project: sandbox }
    proves: [fail-first, captures, sandbox-probe]
    topic: "Add a 10% discount helper\n{probe}\nSTUB_FILE src/discount.ts :: export const discount = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/discount.test.ts :: import { test, expect } from 'bun:test';\\ntest('ten percent off', async () => { expect(await Bun.file(new URL('../src/discount.ts', import.meta.url)).exists()).toBe(true); const { discount } = await import('../src/discount'); expect(discount(100)).toBe(90); });\\n"
    needs: [renderer]   # src/ is a UI path in the sandbox project: the designer captures the change
    cards: [{ node: dispatch, answer: dispatch }, { node: merge-card, answer: merge }]
    timeout_s: 240
    expect: { status: succeeded, result: done, visited: [intake, prepare, spec, dispatch, door, build, pr-open, ci, review, remote-ready, merge-card, merge, after-merge, cleanup, done] }
  - name: firstmate-loopback
    covers: "a project test that spawns its own server on port 0 and connects to it (as money-kit's test/shop.test.ts spawns app/server.ts) passes with the sandbox on: the worker's run_tests, the fail-first gate and CI run it in the check sandbox → review → merge"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    proves: [fail-first]
    topic: "Add a ping server for the health check\nSTUB_FILE src/ping-server.ts :: const server = Bun.serve({ port: 0, hostname: '127.0.0.1', fetch: () => new Response('pong') });\\nprocess.stdout.write(`ping: http://127.0.0.1:${server.port}\\n`);\\n\nSTUB_FILE test/ping.test.ts :: import { test, expect } from 'bun:test';\\ntest('the ping server answers on the port it picked', async () => { const p = Bun.spawn([process.execPath, 'src/ping-server.ts'], { stdout: 'pipe', stderr: 'pipe' }); try { const r = p.stdout.getReader(); let o = ''; while (!/http:\\S+\\s/.test(o)) { const c = await r.read(); expect(c.done).toBe(false); if (c.done) return; o += new TextDecoder().decode(c.value); } const url = /http:\\S+/.exec(o)![0]; expect(await (await fetch(url)).text()).toBe('pong'); } finally { p.kill(); await p.exited; } });\\n"
    needs: [renderer]   # src/ is a UI path in the sandbox project, as in firstmate-merge
    cards: [{ node: dispatch, answer: dispatch }, { node: merge-card, answer: merge }]
    timeout_s: 240
    expect: { status: succeeded, result: done, visited: [spec, dispatch, build, ci, review, merge-card, merge, done] }
  - name: firstmate-blocked
    covers: "the worker reports SCOPE-BLOCKED → scope card → captain parks the Task"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    topic: "Rename the shop greeting STUB_BLOCKED\nSTUB_FILE src/greeting.ts :: export const greeting = 'hi';\\n\nSTUB_FILE test/greeting.test.ts :: import { test, expect } from 'bun:test';\\n"
    cards: [{ node: dispatch, answer: dispatch }, { node: scope-card, answer: park }]
    timeout_s: 240
    expect: { status: succeeded, visited: [spec, dispatch, build, scope-card, parked], not_visited: [merge] }
  - name: firstmate-ask
    covers: "the worker asks the captain a question (ASK) → the captain answers it → the worker builds with the answer → merge"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    needs: [renderer]   # the designer captures the change, as in firstmate-merge
    topic: "Add a percentage discount helper ACCEPT_ASK\nSTUB_FILE src/percent.ts :: export const percent = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/percent.test.ts :: import { test, expect } from 'bun:test';\\ntest('percent', async () => { expect(await Bun.file(new URL('../src/percent.ts', import.meta.url)).exists()).toBe(true); const { percent } = await import('../src/percent'); expect(percent(100)).toBe(90); });\\n"
    cards:
      - { node: dispatch, answer: dispatch }
      - { node: build, answer: answer, note: "ACCEPT_ANSWERED: 10%." }
      - { node: merge-card, answer: merge }
    timeout_s: 240
    expect: { status: succeeded, result: done, visited: [spec, dispatch, build, merge, done], not_visited: [scope-card, parked], min_visits: { build: 2 } }
  - name: github-merge-on-github
    covers: "a project on the GitHub simulator (merging from Studio off): spec → build → push → pull request opened from the repository's template text on the captain's card → CI and GitHub's required check → review → designer → merge card says merge it on GitHub → the captain merges there and closes the card → Studio finds it merged at the gated head → after-merge → done"
    how: firstmate
    setup: [github-sim, staffing-code]
    params: { project: "{project}" }
    needs: [renderer]
    topic: "Add a 10% discount helper\nSTUB_FILE src/discount.ts :: export const discount = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/discount.test.ts :: import { test, expect } from 'bun:test';\\ntest('ten percent off', async () => { expect(await Bun.file(new URL('../src/discount.ts', import.meta.url)).exists()).toBe(true); const { discount } = await import('../src/discount'); expect(discount(100)).toBe(90); });\\n"
    cards: [{ node: dispatch, answer: dispatch }, { node: remote-ready, answer: open }, { node: merge-card, answer: close, before: github-merge }]
    timeout_s: 300
    expect: { status: succeeded, result: done, visited: [spec, dispatch, build, pr-open, ci, review, remote-ready, merge-card, merge, after-merge, done], not_visited: [closed] }
  - name: github-merge-from-studio
    covers: "the same with the operations grant: the captain merges on the merge card and Studio merges the pull request on GitHub (the simulator's squash) → after-merge → done"
    how: firstmate
    setup: [github-sim-ops, staffing-code]
    params: { project: "{project}" }
    needs: [renderer]
    topic: "Add a 10% discount helper\nSTUB_FILE src/discount.ts :: export const discount = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/discount.test.ts :: import { test, expect } from 'bun:test';\\ntest('ten percent off', async () => { expect(await Bun.file(new URL('../src/discount.ts', import.meta.url)).exists()).toBe(true); const { discount } = await import('../src/discount'); expect(discount(100)).toBe(90); });\\n"
    cards: [{ node: dispatch, answer: dispatch }, { node: remote-ready, answer: open }, { node: merge-card, answer: merge }]
    timeout_s: 300
    expect: { status: succeeded, result: done, visited: [spec, dispatch, build, pr-open, ci, review, remote-ready, merge-card, merge, after-merge, done] }
