# Live acceptance: Code (firstmate). The coordinator writes the spec; the dispatch card is the last
# point before work that opens a pull request, so the run stops there. The driver never answers dispatch cards.
schema: 2
workflow: code-firstmate
pin: { version: 1, sha256: "b1bd40f829e25bb924281f148d1cef9788f105f7da0bedf76a02988650be3cb2" }   # bun scripts/acceptance/pin.ts code-firstmate
topic: "Add one sentence to the README that says how to run the offline tests."
start: { provider: null, params: {}, required_params: [project] }
providers: []
approvals: { staffing: false }
cards: []
expect:
  stop_at: dispatch
  artifacts: []
budget: { wall_minutes: 30, max_rounds: 8 }
stub:
  - name: board
    covers: "board start on the sandbox project after the captain approved its staffing → spec round → dispatch card"
    setup: [staffing-code]
    params: { project: sandbox }
    # the stub names this test file in its done line: the sandbox counts test/** as tests (env-preflight)
    topic: "Add one sentence to the README that says how to run the offline tests.\nSTUB_FILE test/readme.test.ts :: import { test } from 'bun:test';\\n"
    expect: { waiting_on: dispatch, visited: [intake, prepare, spec] }
  - name: firstmate-merge
    covers: "Firstmate proposes on the sandbox project → dispatch → spec → build (worker writes the change and its test) → CI → review → local merge"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    topic: "Add a 10% discount helper\nSTUB_FILE src/discount.ts :: export const discount = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/discount.test.ts :: import { test, expect } from 'bun:test';\\ntest('ten percent off', async () => { expect(await Bun.file(new URL('../src/discount.ts', import.meta.url)).exists()).toBe(true); const { discount } = await import('../src/discount'); expect(discount(100)).toBe(90); });\\n"
    needs: [renderer]   # src/ is a UI path in the sandbox project: the designer captures the change
    cards: [{ node: dispatch, answer: dispatch }, { node: merge-card, answer: merge }]
    timeout_s: 240
    expect: { status: succeeded, result: done, visited: [intake, prepare, spec, dispatch, door, build, pr-open, ci, review, remote-ready, merge-card, merge, after-merge, cleanup, done] }
  - name: firstmate-blocked
    covers: "the worker reports SCOPE-BLOCKED → scope card → captain parks the Task"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    topic: "Rename the shop greeting STUB_BLOCKED\nSTUB_FILE src/greeting.ts :: export const greeting = 'hi';\\n\nSTUB_FILE test/greeting.test.ts :: import { test, expect } from 'bun:test';\\n"
    cards: [{ node: dispatch, answer: dispatch }, { node: scope-card, answer: park }]
    timeout_s: 240
    expect: { status: succeeded, visited: [spec, dispatch, build, scope-card, parked], not_visited: [merge] }
  - name: firstmate-ask
    covers: "the worker asks the captain a question (ASK) → the captain answers it → the worker builds with the answer → merge"
    how: firstmate
    setup: [staffing-code]
    params: { project: sandbox }
    needs: [renderer]   # the designer captures the change, as in firstmate-merge
    topic: "Add a percentage discount helper ACCEPT_ASK\nSTUB_FILE src/percent.ts :: export const percent = (p: number) => Math.round(p * 90) / 100;\\n\nSTUB_FILE test/percent.test.ts :: import { test, expect } from 'bun:test';\\ntest('percent', async () => { expect(await Bun.file(new URL('../src/percent.ts', import.meta.url)).exists()).toBe(true); const { percent } = await import('../src/percent'); expect(percent(100)).toBe(90); });\\n"
    cards:
      - { node: dispatch, answer: dispatch }
      - { node: build, answer: answer, note: "ACCEPT_ANSWERED: 10%." }
      - { node: merge-card, answer: merge }
    timeout_s: 240
    expect: { status: succeeded, result: done, visited: [spec, dispatch, build, merge, done], not_visited: [scope-card, parked], min_visits: { build: 2 } }
