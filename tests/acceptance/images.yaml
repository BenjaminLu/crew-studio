# Live acceptance: Images. One Codex image generation, checks, the captain's acceptance card, library.
schema: 2
workflow: images
pin: { version: 1, sha256: "1ff6044b93b46405600ff2bedbf402424679f70ce47df68585d7ea64b02c76bf" }   # bun scripts/acceptance/pin.ts images
topic: "A flat, friendly illustration of a small crew of robots reviewing a checklist, square, light background."
start: { provider: null, params: {} }
providers: [codex]                      # image.generate always uses the configured Codex image model
approvals: { staffing: false }
cards:
  - { node: accept, kind: acceptance, answer: approve-draft, note: "live acceptance: approved to finish the run; quality is judged from the report" }
expect:
  status: succeeded
  result: done
  artifacts: [{ deliver: 1 }]
budget: { wall_minutes: 20, max_rounds: 8 }
stub:
  - name: approve
    covers: "the sandboxed Codex image app-server (stub) → PNG checks → approve → Library"
    provider: codex
    expect: { status: succeeded, visited: [intake, draft, checks, accept, library, done], library: true }
  - name: changes-then-approve
    covers: "captain asks for changes → the image is redrawn with the previous one as reference → approve"
    provider: codex
    cards: [{ node: accept, answers: [changes, approve-draft], note: "Warmer light." }]
    expect: { status: succeeded, visited: [draft, accept, library, done], library: true, min_visits: { draft: 2 } }
