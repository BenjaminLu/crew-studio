# Live acceptance: Pack genesis. The coordinator interviews in one batch; answering the interview
# needs the captain's own words, so the run is accepted when it reaches that card.
schema: 2
workflow: pack-genesis
pin: { version: 1, sha256: "a8c64fda1ae00b86800254aeecc90f08fc8256b537a49c3e08e23f3527f62cb4" }   # bun scripts/acceptance/pin.ts pack-genesis
topic: "A pack that checks every button on a web page has a visible or accessible label."
start: { provider: null, params: {} }
providers: []
approvals: { staffing: false }
cards: []
expect:
  stop_at: interview-answers
  artifacts: []
budget: { wall_minutes: 15, max_rounds: 4 }
stub:
  - name: publish
    covers: "interview round → captain answers → samples round → captain labels → author round → measure → proposals → one shadow Task → promote → publish"
    provider: codex
    timeout_s: 300
    cards:
      - { node: interview-answers, answer: continue, before: pack-interview }
      - { node: label, answer: continue, before: pack-label }
      - { node: proposals, answer: continue, before: pack-proposals }
      - { node: shadow, answer: continue, before: pack-shadow }
      - { node: promote, answer: continue }
      - { node: publish-decision, answer: publish }
    expect: { status: succeeded, visited: [describe, interview, interview-answers, samples, label, draft, measure, proposal-agent, preview, proposals, shadow, promote, publish-decision, publish, end] }
  - name: close-at-interview
    covers: "captain closes the interview card: the Task ends closed"
    provider: codex
    cards: [{ node: interview-answers, answer: close }]
    expect: { status: succeeded, visited: [interview, interview-answers, closed], not_visited: [samples] }
