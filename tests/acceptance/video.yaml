# Live acceptance: Video. An editor agent drafts film.html, the local renderer makes the MP4,
# checks and refine run, the captain's acceptance card approves. A missing renderer stops the run.
schema: 2
workflow: video
pin: { version: 1, sha256: "ac2e69842b0dcfcd84585709c563a64b65a3561590f35c4fbcaa223d757451f1" }   # bun scripts/acceptance/pin.ts video
topic: "A ten-second title card that says Live acceptance passed, with a short fade in and out."
start: { provider: null, params: {} }
providers: []
approvals: { staffing: false }
cards:
  - { node: accept, kind: acceptance, answer: approve-draft, note: "live acceptance: approved to finish the run; quality is judged from the report" }
  - { node: capability, action: stop }
  - { node: escalation, action: stop }
expect:
  status: succeeded
  result: done
  artifacts: [{ deliver: 1 }]
budget: { wall_minutes: 40, max_rounds: 18 }
stub:
  - name: approve
    covers: "editor round on the film template → render (the renderer's own stub copies a real 1920x1080 sample film) → checks → approve → Library"
    provider: codex
    needs: [ffmpeg]
    expect: { status: succeeded, visited: [intake, produce, draft, render, checks, refine, accept, library, done], library: true }
