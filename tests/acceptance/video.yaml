# Live acceptance: Video. An editor agent drafts film.html, the local renderer makes the MP4,
# checks and refine run, the captain's acceptance card approves. A missing renderer stops the run.
schema: 1
workflow: video
topic: "A ten-second title card that says Live acceptance passed, with a short fade in and out."
start: { provider: null, params: {} }
providers: []
approvals: { staffing: false, dispatch: false }
cards:
  - { node: accept, answer: approved, note: "live acceptance: approved to finish the run; quality is judged from the report" }
  - { node: capability, action: stop }
  - { node: escalation, action: stop }
expect:
  status: succeeded
  result: done
  artifacts: [{ deliver: 1 }]
budget: { wall_minutes: 40, max_rounds: 18 }
