name: CI
on:
  pull_request:
  push:
    branches: [main, 'chore/github-ci-*']
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete test inventory
        type: boolean
        default: true
      diagnose_pan:
        description: Collect exactly three sidebar pan diagnostic runs (not full CI)
        type: boolean
        default: false
  schedule:
    - cron: '23 19 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  portable:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_pan || inputs.full
    name: Linux portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - run: node scripts/ci-tests.mjs --mode test:ci:portable
      - name: Publish test summary
        if: always()
        run: find ci-results -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-portable-results
          path: ci-results/
          retention-days: 7
  macos:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_pan || inputs.full
    name: macOS core
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - name: Install browser and renderer prerequisites
        run: |
          node node_modules/playwright/cli.js install chromium
          brew install ffmpeg
      - run: node scripts/ci-tests.mjs --mode core
      - name: Publish test summary
        if: always()
        run: find ci-results -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-core-results
          path: ci-results/
          retention-days: 7
  full:
    name: macOS full (${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/chore/github-ci-'))
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - name: Install browser and renderer prerequisites
        run: |
          node node_modules/playwright/cli.js install chromium
          brew install ffmpeg
      - run: node scripts/ci-tests.mjs --mode full --shard '${{ matrix.shard }}/4'
      - name: Publish test summary
        if: always()
        run: find ci-results -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-full-${{ matrix.shard }}-results
          path: ci-results/
          retention-days: 7
  diagnose-pan:
    name: macOS sidebar pan diagnostics (3 runs; not full CI)
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_pan && !inputs.full
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - name: Install browser and renderer prerequisites
        run: |
          node node_modules/playwright/cli.js install chromium
          brew install ffmpeg
      - name: Collect three canonical sidebar pan runs
        run: node scripts/diagnose-sidebar-pan.mjs
      - name: Publish diagnostic summary
        if: always()
        run: test ! -f ci-results/diagnostic-078/summary.md || cat ci-results/diagnostic-078/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-sidebar-pan-diagnostic-only
          path: ci-results/diagnostic-078/
          retention-days: 7
