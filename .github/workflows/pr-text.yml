name: PR text
# The pull request body follows the repository's PR template and, like every commit message in it, has no session link
# (CONTRIBUTING.md). Runs again when the body is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  text:
    name: PR text
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Body follows the PR template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          bun scripts/contribution-templates.ts --dir . --check-body "$RUNNER_TEMP/pr-body.md"
      - name: Commit messages have no session link
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/contribution-templates.ts --dir . --check-commits "$BASE..$HEAD"
